<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF 超级分割工具 (小王子)</title>
    
    <!-- 核心库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <style>
        /* 基础设置 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

        /* 分割线样式 - 增加手机端触摸热区 */
        .line-col {
            position: absolute; top: 0; bottom: 0; width: 2px;
            background-color: #ef4444; z-index: 30;
            touch-action: none; transition: background-color 0.2s, width 0.2s;
        }
        .line-col::after { content: ''; position: absolute; left: -15px; right: -15px; top: 0; bottom: 0; }
        .line-col.active { background-color: #f43f5e; width: 4px; margin-left: -1px; box-shadow: 0 0 12px rgba(244, 63, 94, 0.6); }

        .line-row {
            position: absolute; left: 0; right: 0; height: 2px;
            background-color: #3b82f6; z-index: 31;
            touch-action: none; transition: background-color 0.2s, height 0.2s;
        }
        .line-row::after { content: ''; position: absolute; top: -15px; bottom: -15px; left: 0; right: 0; }
        .line-row.active { background-color: #0ea5e9; height: 4px; margin-top: -1px; box-shadow: 0 0 12px rgba(14, 165, 233, 0.6); }

        .loading-overlay { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px); }
        .modal-enter { animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* 按钮动画 */
        .btn-hover { transition: all 0.2s; }
        .btn-hover:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800 pb-10">

    <!-- 顶部导航 -->
    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="container mx-auto px-4 h-16 flex justify-between items-center">
            
            <!-- 左侧 Logo 区域 -->
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-200">
                    <!-- 星星图标 (象征小王子) -->
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-base md:text-lg font-bold text-slate-800 leading-tight">
                        PDF 超级分割
                    </h1>
                    <span class="text-[10px] text-indigo-500 font-medium tracking-wide uppercase">小王子</span>
                </div>

                <!-- 外部链接 (折叠图标) -->
                <div class="hidden sm:flex items-center gap-1 ml-4 pl-4 border-l border-slate-200">
                    <a href="https://www.ilovepdf.com.cn/zh-cn/" target="_blank" class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition" title="iLovePDF">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    </a>
                    <a href="https://tools.pdf24.org/zh/" target="_blank" class="p-1.5 text-slate-400 hover:text-blue-500 hover:bg-blue-50 rounded-lg transition" title="PDF24">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </a>
                </div>
            </div>

            <!-- 右侧操作区 -->
            <div class="flex items-center gap-2 md:gap-3">
                <button onclick="document.getElementById('add-file-input').click()" class="btn-hover hidden md:flex items-center gap-2 bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    添加文件
                </button>
                <input type="file" id="add-file-input" accept="application/pdf" multiple class="hidden" />

                <!-- 手机端简化添加按钮 -->
                <button onclick="document.getElementById('add-file-input').click()" class="btn-hover md:hidden bg-slate-100 text-slate-700 p-2 rounded-xl hover:bg-slate-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>

                <button onclick="processAndDownload()" class="btn-hover bg-gradient-to-r from-indigo-600 to-violet-600 text-white px-4 py-2 rounded-xl shadow-lg shadow-indigo-200 text-sm font-bold flex items-center gap-2">
                    <span>下载</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>
                
                <button onclick="resetAll()" class="btn-hover text-slate-400 p-2 hover:bg-red-50 hover:text-red-500 rounded-xl transition" title="清空所有">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 pt-6 flex flex-col items-center">
        
        <!-- 全局工具栏 -->
        <div id="global-toolbar" class="hidden w-full max-w-5xl mb-6 p-1 pr-2 bg-white rounded-2xl shadow-sm border border-slate-100 flex-wrap justify-between items-center gap-2 animate-[fadeIn_0.3s]">
            <div class="flex items-center gap-2 px-3 py-2 bg-indigo-50 rounded-xl">
                <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span class="text-sm text-indigo-900 font-bold">批量设置</span>
            </div>
            
            <div class="flex items-center gap-2 flex-grow justify-end">
                <div class="flex items-center border border-slate-200 rounded-lg bg-white px-2 py-1 shadow-sm focus-within:ring-2 focus-within:ring-red-100 focus-within:border-red-300">
                    <span class="text-[10px] text-red-500 font-bold uppercase mr-1 tracking-wider">竖</span>
                    <input type="number" id="global-col" value="1" min="1" class="w-8 bg-transparent text-center text-sm outline-none font-medium text-slate-700">
                </div>
                <div class="flex items-center border border-slate-200 rounded-lg bg-white px-2 py-1 shadow-sm focus-within:ring-2 focus-within:ring-blue-100 focus-within:border-blue-300">
                    <span class="text-[10px] text-blue-500 font-bold uppercase mr-1 tracking-wider">横</span>
                    <input type="number" id="global-row" value="1" min="1" class="w-8 bg-transparent text-center text-sm outline-none font-medium text-slate-700">
                </div>
                <button onclick="applyGlobalDirect()" class="btn-hover bg-slate-800 text-white px-4 py-1.5 rounded-lg text-xs font-medium shadow-md">应用到全部</button>
            </div>
        </div>

        <!-- 初始上传引导区 -->
        <div id="upload-area" class="w-full max-w-xl mt-8 animate-[fadeIn_0.5s]">
            <div class="group relative border-2 border-dashed border-indigo-200 rounded-3xl bg-white p-10 text-center hover:border-indigo-400 hover:bg-indigo-50/30 transition-all cursor-pointer shadow-sm hover:shadow-md" onclick="document.getElementById('add-file-input').click()">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 group-hover:bg-indigo-100 transition-all duration-300">
                    <!-- 云上传图标 -->
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-slate-700">点击添加 PDF 文件</h2>
                <p class="text-sm text-slate-400 mt-2">支持多文件合并、批量参数复制</p>
            </div>
            
            <!-- 友情链接列表 -->
            <div class="mt-8 space-y-3 px-2">
                <a href="https://www.ilovepdf.com.cn/zh-cn/" target="_blank" class="flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm border border-slate-100 hover:border-red-200 hover:shadow-md transition-all group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-red-50 flex items-center justify-center text-red-500 group-hover:bg-red-500 group-hover:text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        </div>
                        <div class="text-left">
                            <div class="text-sm font-bold text-slate-700">iLovePDF</div>
                            <div class="text-xs text-slate-400">专业的 PDF 转换与压缩工具</div>
                        </div>
                    </div>
                    <svg class="w-4 h-4 text-slate-300 group-hover:text-red-400 group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </a>
                
                <a href="https://tools.pdf24.org/zh/" target="_blank" class="flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm border border-slate-100 hover:border-blue-200 hover:shadow-md transition-all group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        </div>
                        <div class="text-left">
                            <div class="text-sm font-bold text-slate-700">PDF24 工具箱</div>
                            <div class="text-xs text-slate-400">免费且功能强大的离线级工具</div>
                        </div>
                    </div>
                    <svg class="w-4 h-4 text-slate-300 group-hover:text-blue-400 group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </a>
            </div>
        </div>

        <!-- 页面列表 -->
        <div id="pages-container" class="w-full max-w-5xl flex flex-col gap-5 hidden pb-20"></div>

    </main>

    <!-- 复制参数模态框 -->
    <div id="copy-modal" class="hidden fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl p-6 modal-enter shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-indigo-100 text-indigo-600 rounded-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 01-2-2V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2"></path></svg>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800">应用分割参数</h3>
                </div>
                <button onclick="closeCopyModal()" class="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="space-y-3 mb-8">
                <label class="group flex items-center gap-4 p-4 border border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition-all">
                    <input type="radio" name="copy-target" value="all" class="w-5 h-5 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                    <span class="font-medium text-slate-700">所有页面</span>
                </label>
                <label class="group flex items-center gap-4 p-4 border border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition-all">
                    <input type="radio" name="copy-target" value="current-file" class="w-5 h-5 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                    <span class="font-medium text-slate-700">仅当前文件</span>
                </label>
                <label class="group flex flex-col p-4 border border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition-all">
                    <div class="flex items-center gap-4 mb-3">
                        <input type="radio" name="copy-target" value="range" class="w-5 h-5 text-indigo-600 border-gray-300 focus:ring-indigo-500" checked>
                        <span class="font-medium text-slate-700">指定页码范围</span>
                    </div>
                    <input type="text" id="range-input" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 outline-none transition" placeholder="例如: 1-5, 8">
                </label>
            </div>

            <button onclick="executeCopy()" class="btn-hover w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold text-base shadow-lg shadow-indigo-200">确认应用</button>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden fixed inset-0 z-[100] flex items-center justify-center loading-overlay">
        <div class="bg-white/80 px-8 py-6 rounded-2xl shadow-2xl flex flex-col items-center backdrop-blur-md border border-white/50">
            <div class="relative w-12 h-12 mb-4">
                <div class="absolute inset-0 border-4 border-indigo-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
            <p id="loading-text" class="text-slate-700 font-bold tracking-wide">处理中...</p>
        </div>
    </div>

    <script>
        const state = {
            documents: [],
            pages: [],
            nextDocId: 1,
            drag: { active: false, type: null, globalIndex: -1, lineIndex: -1 },
            copySourceIndex: -1
        };

        const els = {
            fileInput: document.getElementById('add-file-input'),
            uploadArea: document.getElementById('upload-area'),
            pagesContainer: document.getElementById('pages-container'),
            loading: document.getElementById('loading'),
            loadingText: document.getElementById('loading-text'),
            modal: document.getElementById('copy-modal'),
            globalToolbar: document.getElementById('global-toolbar')
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const idx = parseInt(entry.target.dataset.index);
                    renderPageCanvas(idx);
                    observer.unobserve(entry.target);
                }
            });
        }, { rootMargin: '200px' });

        els.fileInput.addEventListener('change', handleAddFiles);

        function getEvenSplits(n) {
            n = parseInt(n) || 1;
            if (n <= 1) return [];
            return Array.from({length: n-1}, (_, i) => (i+1)/n);
        }

        async function handleAddFiles(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            showLoading('正在解析魔法书...');
            els.uploadArea.classList.add('hidden');
            els.pagesContainer.classList.remove('hidden');
            els.globalToolbar.classList.remove('hidden'); 
            els.globalToolbar.classList.add('flex');

            try {
                for (const file of files) {
                    if (file.type !== 'application/pdf') continue;
                    const buffer = await file.arrayBuffer();
                    const pdfDoc = await pdfjsLib.getDocument(buffer).promise;
                    const docId = state.nextDocId++;
                    state.documents.push({ id: docId, file, pdfDoc, fileName: file.name, pageCount: pdfDoc.numPages });

                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        const globalIndex = state.pages.length;
                        state.pages.push({
                            globalIndex, docId, pageIndexInDoc: i,
                            cols: [], rows: [], rendered: false
                        });
                        createPageCard(globalIndex);
                    }
                }
            } catch (err) {
                alert('哦不，解析出了点问题: ' + err.message);
            } finally {
                hideLoading();
                els.fileInput.value = '';
            }
        }

        function createPageCard(globalIndex) {
            const pageData = state.pages[globalIndex];
            const docData = state.documents.find(d => d.id === pageData.docId);
            
            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition-shadow duration-300";
            card.innerHTML = `
                <div class="bg-slate-50/80 border-b border-slate-100 px-4 py-3 flex justify-between items-center">
                    <div class="overflow-hidden pr-2">
                        <div class="font-bold text-slate-700 text-sm flex items-center gap-2">
                            <span class="w-6 h-6 bg-white rounded-full flex items-center justify-center text-xs shadow-sm border border-slate-100 text-slate-500">${globalIndex + 1}</span>
                            <span class="truncate text-xs font-normal text-slate-400 max-w-[120px]">${docData.fileName}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center bg-white rounded-lg border border-slate-200 shadow-sm p-0.5">
                            <input type="number" id="in-col-${globalIndex}" value="1" min="1" class="w-8 py-1 text-center text-xs outline-none text-slate-700 font-medium" onchange="updatePageSplit(${globalIndex})">
                            <span class="text-slate-300 text-[10px]">✕</span>
                            <input type="number" id="in-row-${globalIndex}" value="1" min="1" class="w-8 py-1 text-center text-xs outline-none text-slate-700 font-medium" onchange="updatePageSplit(${globalIndex})">
                        </div>
                        <button onclick="openCopyModal(${globalIndex})" class="p-1.5 text-indigo-500 hover:bg-indigo-50 rounded-lg transition" title="复制参数">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 01-2-2V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="bg-slate-100 flex justify-center overflow-hidden relative min-h-[150px]">
                    <div class="relative inline-block shadow-xl bg-white my-4 lazy-canvas select-none ring-1 ring-slate-900/5" data-index="${globalIndex}" style="font-size: 0;">
                        <canvas id="canvas-${globalIndex}" class="block max-w-full"></canvas>
                        <div id="overlay-${globalIndex}" class="absolute inset-0 z-10 touch-none"></div> 
                        <div id="placeholder-${globalIndex}" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-xs">
                            <svg class="w-6 h-6 mb-1 text-slate-300 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            绘制中...
                        </div>
                    </div>
                </div>
            `;
            els.pagesContainer.appendChild(card);
            observer.observe(card.querySelector('.lazy-canvas'));
        }

        async function renderPageCanvas(globalIndex) {
            const pageData = state.pages[globalIndex];
            const docData = state.documents.find(d => d.id === pageData.docId);
            try {
                const page = await docData.pdfDoc.getPage(pageData.pageIndexInDoc);
                const canvas = document.getElementById(`canvas-${globalIndex}`);
                const placeholder = document.getElementById(`placeholder-${globalIndex}`);
                
                const viewportRaw = page.getViewport({ scale: 1.0 });
                const desiredWidth = Math.min(window.innerWidth - 40, 800);
                const scale = desiredWidth / viewportRaw.width;
                const viewport = page.getViewport({ scale: scale });

                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                placeholder.remove();
                pageData.rendered = true;
                renderLines(globalIndex);
            } catch (e) { console.error(e); }
        }

        function renderLines(globalIndex) {
            const overlay = document.getElementById(`overlay-${globalIndex}`);
            if (!overlay) return;
            overlay.innerHTML = '';
            const config = state.pages[globalIndex];

            const bindEvents = (el, type, idx) => {
                el.addEventListener('mousedown', (e) => startDrag(e, type, globalIndex, idx));
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault(); 
                    startDrag(e.touches[0], type, globalIndex, idx);
                }, {passive: false});
            };

            config.cols.forEach((pct, idx) => {
                const line = document.createElement('div');
                line.className = 'line-col';
                line.style.left = (pct * 100) + '%';
                bindEvents(line, 'col', idx);
                overlay.appendChild(line);
            });

            config.rows.forEach((pct, idx) => {
                const line = document.createElement('div');
                line.className = 'line-row';
                line.style.top = (pct * 100) + '%';
                bindEvents(line, 'row', idx);
                overlay.appendChild(line);
            });
        }

        function startDrag(e, type, gIdx, lIdx) {
            state.drag = { active: true, type, globalIndex: gIdx, lineIndex: lIdx };
            const overlay = document.getElementById(`overlay-${gIdx}`);
            const lines = overlay.querySelectorAll(type === 'col' ? '.line-col' : '.line-row');
            if(lines[lIdx]) lines[lIdx].classList.add('active');
        }

        const moveHandler = (clientX, clientY) => {
            if (!state.drag.active) return;
            const { type, globalIndex, lineIndex } = state.drag;
            const overlay = document.getElementById(`overlay-${globalIndex}`);
            if(!overlay) return;

            const rect = overlay.getBoundingClientRect();
            if (type === 'col') {
                let x = clientX - rect.left;
                x = Math.max(0, Math.min(x, rect.width));
                state.pages[globalIndex].cols[lineIndex] = x / rect.width;
            } else {
                let y = clientY - rect.top;
                y = Math.max(0, Math.min(y, rect.height));
                state.pages[globalIndex].rows[lineIndex] = y / rect.height;
            }
            renderLines(globalIndex);
        };

        window.addEventListener('mousemove', e => moveHandler(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => {
            if(state.drag.active) e.preventDefault();
            moveHandler(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        const endHandler = () => {
            state.drag.active = false;
            document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
        };
        window.addEventListener('mouseup', endHandler);
        window.addEventListener('touchend', endHandler);


        window.updatePageSplit = (idx) => {
            const c = document.getElementById(`in-col-${idx}`).value;
            const r = document.getElementById(`in-row-${idx}`).value;
            state.pages[idx].cols = getEvenSplits(c);
            state.pages[idx].rows = getEvenSplits(r);
            renderLines(idx);
        };

        window.applyGlobalDirect = () => {
            const c = getEvenSplits(document.getElementById('global-col').value);
            const r = getEvenSplits(document.getElementById('global-row').value);
            state.pages.forEach((p, i) => {
                p.cols = [...c]; p.rows = [...r];
                document.getElementById(`in-col-${i}`).value = c.length+1;
                document.getElementById(`in-row-${i}`).value = r.length+1;
                if(p.rendered) renderLines(i);
            });
        };

        window.openCopyModal = (idx) => {
            state.copySourceIndex = idx;
            els.modal.classList.remove('hidden');
        };
        window.closeCopyModal = () => els.modal.classList.add('hidden');

        window.executeCopy = () => {
            const src = state.pages[state.copySourceIndex];
            const type = document.querySelector('input[name="copy-target"]:checked').value;
            let targets = [];

            if (type === 'all') targets = state.pages.map((_,i)=>i);
            else if (type === 'current-file') targets = state.pages.map((p,i) => p.docId === src.docId ? i : -1).filter(i=>i!==-1);
            else {
                const parts = document.getElementById('range-input').value.split(/[,，]/);
                parts.forEach(p => {
                    p = p.trim();
                    if(p.includes('-')) {
                        const [s,e] = p.split('-').map(Number);
                        for(let i=Math.min(s,e); i<=Math.max(s,e); i++) if(i>0 && i<=state.pages.length) targets.push(i-1);
                    } else {
                        const n = Number(p);
                        if(n>0 && n<=state.pages.length) targets.push(n-1);
                    }
                });
            }
            targets.forEach(i => {
                state.pages[i].cols = [...src.cols]; state.pages[i].rows = [...src.rows];
                document.getElementById(`in-col-${i}`).value = src.cols.length+1;
                document.getElementById(`in-row-${i}`).value = src.rows.length+1;
                if(state.pages[i].rendered) renderLines(i);
            });
            closeCopyModal();
        };

        async function processAndDownload() {
            if (!state.pages.length) return;
            showLoading('正在施展分割魔法...');
            setTimeout(async () => {
                try {
                    const newPdf = await PDFLib.PDFDocument.create();
                    const loadedDocs = {};
                    for (const p of state.pages) {
                        const d = state.documents.find(doc => doc.id === p.docId);
                        if (!loadedDocs[d.id]) {
                            const b = await d.file.arrayBuffer();
                            loadedDocs[d.id] = await PDFLib.PDFDocument.load(b);
                        }
                        const srcDoc = loadedDocs[d.id];
                        const page = srcDoc.getPage(p.pageIndexInDoc - 1);
                        const { width, height } = page.getSize();
                        
                        const cols = [0, ...p.cols.sort((a,b)=>a-b), 1];
                        const rows = [0, ...p.rows.sort((a,b)=>a-b), 1];
                        
                        const copies = await newPdf.copyPages(srcDoc, Array((cols.length-1)*(rows.length-1)).fill(p.pageIndexInDoc-1));
                        let cIdx = 0;
                        
                        for (let r=0; r<rows.length-1; r++) {
                            const y1 = rows[r], y2 = rows[r+1];
                            for (let c=0; c<cols.length-1; c++) {
                                const x1 = cols[c], x2 = cols[c+1];
                                const cp = copies[cIdx++];
                                cp.setCropBox(width*x1, height*(1-y2), width*(x2-x1), height*(y2-y1));
                                newPdf.addPage(cp);
                            }
                        }
                    }
                    const b = await newPdf.save();
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(new Blob([b], {type: 'application/pdf'}));
                    link.download = `little-prince-split-${Date.now()}.pdf`;
                    link.click();
                } catch(e) { alert(e.message); }
                finally { hideLoading(); }
            }, 50);
        }

        window.resetAll = () => confirm('确定要清空所有内容重新开始吗？') && location.reload();
        function showLoading(t) { els.loadingText.textContent = t; els.loading.classList.remove('hidden'); }
        function hideLoading() { els.loading.classList.add('hidden'); }
    </script>
</body>
