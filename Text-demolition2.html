<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字拆图</title>
    <!-- 引入更多谷歌开源中文字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <!-- 引入 JSZip 用于电脑端一键打包 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --panel: #FFFFFF;
            --text: #1F2937;
            --border: #E5E7EB;
        }
        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            color: var(--text);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            align-items: start;
        }
        .panel {
            background: var(--panel);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        h2 { 
            margin-top: 0; 
            font-size: 1.25rem; 
            border-bottom: 2px solid var(--border); 
            padding-bottom: 12px; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 0.9rem; 
            color: #4B5563;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        textarea { resize: vertical; height: 80px; }
        
        .flex-row { display: flex; gap: 12px; }
        .flex-row > div { flex: 1; }
        
        input[type="color"] { 
            width: 100%; 
            height: 42px; 
            padding: 2px; 
            border: 1px solid #D1D5DB; 
            border-radius: 8px; 
            cursor: pointer; 
            background: #fff;
        }
        
        /* 滑块样式 */
        .slider-group {
            background: #F9FAFB;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }
        
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
            padding: 10px 0;
            color: var(--primary);
        }
        .toggle-label input { width: auto; transform: scale(1.2); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn-generate { background-color: var(--primary); color: white; box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2); }
        .btn-generate:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-download { background-color: #10B981; color: white; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2); }
        .btn-download:hover { background-color: #059669; transform: translateY(-1px); }
        
        .preview-panel {
            background: var(--bg);
            box-shadow: none;
            padding: 0;
        }
        .canvas-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
            margin-top: 15px;
        }
        canvas {
            background: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            max-width: 100%;
            width: 180px; /* 默认预览大小，不影响保存尺寸 */
            height: auto;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        canvas:hover { transform: scale(1.02); }
        .help-text { font-size: 0.8rem; color: #6B7280; margin-top: 6px; }

        /* 新增：模态框样式 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--panel); width: 90%; max-width: 600px; max-height: 85vh;
            border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .modal-header {
            padding: 15px 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h3 { margin: 0; font-size: 1.1rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #6B7280; }
        .modal-body {
            padding: 20px; overflow-y: auto; flex: 1; background: var(--bg);
            text-align: center;
        }
        .modal-footer {
            padding: 15px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px;
        }
        .export-img { max-width: 150px; height: auto; margin: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .mobile-tip { background: #FEF3C7; color: #D97706; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 0.9rem; }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
            canvas { width: 45%; min-width: 120px; }
        }
    </style>
</head>
<body>

<!-- 隐藏的 SVG 滤镜：用于生成手绘/粉笔毛糙边缘效果 -->
<svg style="display: none;">
    <defs>
        <filter id="handDrawnFilter" x="-20%" y="-20%" width="140%" height="140%">
            <!-- 生成分形噪声，用于模拟纸张纹理和笔触的不规则感 -->
            <feTurbulence id="svgTurbulence" type="fractalNoise" baseFrequency="0.15" numOctaves="3" result="noise" />
            <!-- 使用噪声对源图像(文字)的边缘进行置换扭曲 -->
            <feDisplacementMap id="svgDisplacement" in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </defs>
</svg>

<div class="container">
    <!-- 左侧：控制面板 -->
    <div class="panel">
        <h2>🛠️ 基础设置</h2>
        
        <div class="form-group">
            <label>输入文字</label>
            <textarea id="inputText" oninput="autoGenerate()" placeholder="输入你想生成的文字...">小王子!</textarea>
        </div>

        <div class="form-group">
            <label>单图字数 (多少个字拼在一张图上)</label>
            <input type="number" id="charsPerImg" oninput="autoGenerate()" value="1" min="1" max="20">
        </div>

        <div class="flex-row form-group">
            <div>
                <label>文字颜色</label>
                <input type="color" id="textColor" oninput="autoGenerate()" value="#1A1A1A">
            </div>
            <div>
                <label>背景颜色</label>
                <input type="color" id="bgColor" oninput="autoGenerate()" value="#FFFFFF">
            </div>
        </div>

        <div class="form-group">
            <label>选择字体</label>
            <select id="fontFamily" onchange="autoGenerate()">
                <optgroup label="手写 & 毛笔风 (推荐)">
                    <option value="'Ma Shan Zheng', cursive" selected>马善政毛笔 (稳重手写)</option>
                    <option value="'Zhi Mang Xing', cursive">志莽行书 (潇洒行草)</option>
                    <option value="'Liu Jian Mao Cao', cursive">刘建毛草 (狂放草书)</option>
                    <option value="'Long Cang', cursive">龙藏体 (灵动手写)</option>
                </optgroup>
                <optgroup label="经典排版风">
                    <option value="'Noto Serif SC', serif">思源宋体 (复古/学术)</option>
                    <option value="'Noto Sans SC', sans-serif">思源黑体 (现代/简约)</option>
                </optgroup>
                <optgroup label="系统自带字体">
                    <option value="'KaiTi', 'STKaiti', serif">系统楷体</option>
                    <option value="'SimSun', serif">系统宋体</option>
                    <option value="'Microsoft YaHei', sans-serif">微软雅黑</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label>图片尺寸 (默认手机壁纸 9:16)</label>
            <div class="flex-row">
                <input type="number" id="imgWidth" oninput="autoGenerate()" value="1080" placeholder="宽">
                <input type="number" id="imgHeight" oninput="autoGenerate()" value="1920" placeholder="高">
            </div>
        </div>

        <h2 style="margin-top: 25px;">✨ 高级手绘参数</h2>
        
        <label class="toggle-label">
            <input type="checkbox" id="enableHandDrawn" onchange="autoGenerate()" checked>
            开启边缘毛糙手绘效果
        </label>
        
        <div id="advancedControls">
            <div class="slider-group">
                <div class="slider-header">
                    <span>边缘毛糙度 (扭曲)</span>
                    <span id="valDistortion">5</span>
                </div>
                <input type="range" id="distortionScale" min="0" max="20" step="1" value="5" oninput="updateFilters()">
                <div class="help-text">值越大，边缘像水墨晕染或粉笔化得越厉害。</div>
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <span>笔触颗粒感 (密度)</span>
                    <span id="valNoise">0.15</span>
                </div>
                <input type="range" id="noiseFreq" min="0.01" max="0.3" step="0.01" value="0.15" oninput="updateFilters()">
                <div class="help-text">值越大，边缘破碎的颗粒越细密。</div>
            </div>

            <div class="slider-group">
                <div class="slider-header">
                    <span>文字加粗 (描边厚度)</span>
                    <span id="valStroke">2</span>
                </div>
                <input type="range" id="strokeWidth" min="0" max="40" step="1" value="2" oninput="autoGenerate()">
                <div class="help-text">补充原字体太细的问题，增加分量感。</div>
            </div>
        </div>

        <button class="btn btn-generate" onclick="generateImages()" style="margin-top: 15px;">强制刷新生成</button>
        <button class="btn btn-download" onclick="downloadAll()" id="downloadBtn" style="display: none;">💾 批量保存高清原图</button>
        <div id="statusMsg" class="help-text" style="color: #10B981; font-weight: bold; text-align: center;"></div>
    </div>

    <!-- 右侧：预览面板 -->
    <div class="panel preview-panel">
        <h2 style="padding: 20px 20px 0 20px; border:none; margin:0;">👀 实时预览图</h2>
        <div class="help-text" style="padding: 0 20px;">所见即所得。调整左侧参数，这里会实时变化。（显示为缩略图，保存为高清大图）</div>
        <div class="canvas-container" style="padding: 0 20px 20px 20px;" id="canvasContainer"></div>
    </div>
</div>

<!-- 新增：导出模态框 -->
<div id="exportModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>💾 保存图片</h3>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="mobile-tip">📱 手机端：请直接 <b>长按下方图片</b> 保存到相册<br>💻 电脑端：右键图片另存为，或点击下方打包下载</div>
            <div id="modalImageContainer"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-download" style="margin-bottom:0;" onclick="downloadZip()">📦 电脑端：打包下载为 ZIP</button>
        </div>
    </div>
</div>

<script>
    let debounceTimer;

    // 分离文本，支持 Emoji
    function splitText(text) {
        return Array.from(text);
    }

    // 实时更新 SVG 滤镜参数
    function updateFilters() {
        const scale = document.getElementById('distortionScale').value;
        const freq = document.getElementById('noiseFreq').value;
        
        document.getElementById('valDistortion').innerText = scale;
        document.getElementById('valNoise').innerText = freq;
        
        document.getElementById('svgDisplacement').setAttribute('scale', scale);
        document.getElementById('svgTurbulence').setAttribute('baseFrequency', freq);
        
        autoGenerate(); // 更新滤镜后重新渲染画布
    }

    // 防抖自动生成，避免拖动滑块时卡顿
    function autoGenerate() {
        // 更新加粗数值显示
        document.getElementById('valStroke').innerText = document.getElementById('strokeWidth').value;
        
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            generateImages();
        }, 50); // 50毫秒防抖，实现丝滑实时预览
    }

    function generateImages() {
        const text = document.getElementById('inputText').value.replace(/\n/g, ''); // 过滤回车
        const charsPerImg = parseInt(document.getElementById('charsPerImg').value) || 1;
        const textColor = document.getElementById('textColor').value;
        const bgColor = document.getElementById('bgColor').value;
        const fontFamily = document.getElementById('fontFamily').value;
        const width = parseInt(document.getElementById('imgWidth').value) || 1080;
        const height = parseInt(document.getElementById('imgHeight').value) || 1920;
        
        const isHandDrawn = document.getElementById('enableHandDrawn').checked;
        const extraStroke = parseInt(document.getElementById('strokeWidth').value) || 0;
        
        const container = document.getElementById('canvasContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusMsg = document.getElementById('statusMsg');
        
        container.innerHTML = '';
        statusMsg.innerHTML = '';

        if (!text) {
            container.innerHTML = '<div style="color:#9CA3AF; padding: 20px;">等待输入文字...</div>';
            downloadBtn.style.display = 'none';
            return;
        }

        const chars = splitText(text);
        const groups = [];
        
        for (let i = 0; i < chars.length; i += charsPerImg) {
            groups.push(chars.slice(i, i + charsPerImg).join(''));
        }

        groups.forEach((groupText, index) => {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.className = 'result-canvas';
            
            const ctx = canvas.getContext('2d');
            
            // 1. 绘制背景（背景不加滤镜，保持干净）
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, width, height);
            
            // 2. 配置字体
            // 基础字号计算逻辑
            const maxFontSizeByWidth = (width / groupText.length) * 0.85; 
            const maxFontSizeByHeight = height * 0.8;
            const fontSize = Math.min(maxFontSizeByWidth, maxFontSizeByHeight);
            
            ctx.font = `${fontSize}px ${fontFamily}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 3. 应用手绘滤镜 (仅对文字生效)
            // 注意：依赖浏览器的 Canvas 支持，目前主流 Chrome, Edge, Safari 均支持 ctx.filter 绑定 SVG 滤镜
            if (isHandDrawn) {
                ctx.filter = 'url(#handDrawnFilter)';
            } else {
                ctx.filter = 'none';
            }

            // 4. 绘制文字 (填充)
            ctx.fillStyle = textColor;
            ctx.fillText(groupText, width / 2, height / 2);
            
            // 5. 如果需要加粗，使用 stroke 描边
            if (extraStroke > 0) {
                ctx.strokeStyle = textColor;
                ctx.lineWidth = extraStroke;
                ctx.lineJoin = 'round'; // 圆润的边角，更像手写
                ctx.strokeText(groupText, width / 2, height / 2);
            }

            // 绘制完成后，重置 filter 以免影响后续操作
            ctx.filter = 'none';
            
            container.appendChild(canvas);
        });

        if (groups.length > 0) {
            downloadBtn.style.display = 'block';
        }
    }

    // 优雅的保存方案：弹出模态框显示真实 img，兼顾手机长按保存与电脑打包
    function downloadAll() {
        const canvases = document.querySelectorAll('.result-canvas');
        if (canvases.length === 0) return;

        const modal = document.getElementById('exportModal');
        const imgContainer = document.getElementById('modalImageContainer');
        imgContainer.innerHTML = ''; // 清空旧图片

        // 将 Canvas 转换为真实的 img 标签，方便手机端长按保存
        canvases.forEach((canvas) => {
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/png', 1.0); // 高清 PNG
            img.className = 'export-img';
            imgContainer.appendChild(img);
        });

        // 显示模态框
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('exportModal').style.display = 'none';
    }

    // 使用 JSZip 打包下载 (主要针对电脑端批量下载)
    async function downloadZip() {
        try {
            const btn = document.querySelector('.modal-footer .btn-download');
            const originalText = btn.innerHTML;
            btn.innerHTML = '打包中...';
            btn.disabled = true;

            const zip = new JSZip();
            const images = document.querySelectorAll('.export-img');
            const textPrefix = document.getElementById('inputText').value.substring(0, 2) || '文字';
            
            images.forEach((img, index) => {
                const data = img.src.split(',')[1];
                const fileIndex = (index + 1).toString().padStart(2, '0');
                zip.file(`手绘文字_${textPrefix}_${fileIndex}.png`, data, {base64: true});
            });

            const content = await zip.generateAsync({type: "blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `手绘文字打包_${textPrefix}.zip`;
            link.click();
            
            btn.innerHTML = originalText;
            btn.disabled = false;
        } catch (e) {
            alert('打包下载失败，请尝试长按或右键单张保存图片。');
        }
    }

    // 页面加载完成后自动初始化渲染一次
    window.onload = () => {
        // 等待字体加载稍微延迟一下渲染
        setTimeout(autoGenerate, 200);
    };
</script>

</body>
</html>
