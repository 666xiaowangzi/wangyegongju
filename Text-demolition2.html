<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字拆图</title>
    <link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --panel: #FFFFFF;
            --text: #1F2937;
            --border: #E5E7EB;
        }
        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            color: var(--text);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            align-items: start;
        }
        .panel {
            background: var(--panel);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        h2 { 
            margin-top: 0; 
            font-size: 1.25rem; 
            border-bottom: 2px solid var(--border); 
            padding-bottom: 12px; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 0.9rem; 
            color: #4B5563;
        }
        .char-count {
            position: absolute;
            right: 0;
            top: 0;
            font-size: 0.8rem;
            color: #6B7280;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        textarea { resize: vertical; height: 80px; }
        
        .flex-row { display: flex; gap: 12px; }
        .flex-row > div { flex: 1; }
        
        input[type="color"] { 
            width: 100%; 
            height: 42px; 
            padding: 2px; 
            border: 1px solid #D1D5DB; 
            border-radius: 8px; 
            cursor: pointer; 
            background: #fff;
        }
        
        .slider-group {
            background: #F9FAFB;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="range"] { width: 100%; accent-color: var(--primary); }
        
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
            padding: 10px 0;
            color: var(--primary);
        }
        .toggle-label input { width: auto; transform: scale(1.2); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn-generate { background-color: var(--primary); color: white; box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2); }
        .btn-generate:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-download { background-color: #10B981; color: white; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2); margin-bottom: 0; }
        .btn-download:hover { background-color: #059669; transform: translateY(-1px); }
        .btn-download:disabled { background-color: #9CA3AF; cursor: not-allowed; box-shadow: none; }
        
        /* 加载更多按钮样式 */
        .btn-loadmore { 
            background-color: #F3F4F6; 
            color: #4B5563; 
            border: 2px dashed #D1D5DB; 
            margin: 0 20px 20px 20px;
            width: calc(100% - 40px);
            display: none;
        }
        .btn-loadmore:hover { background-color: #E5E7EB; border-color: #9CA3AF; }

        .preview-panel {
            background: var(--bg);
            box-shadow: none;
            padding: 0;
        }
        .canvas-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
            margin-top: 15px;
        }
        /* 预览图片样式 */
        .result-img {
            background: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            max-width: 100%;
            width: 180px;
            height: auto;
            border-radius: 8px;
            transition: transform 0.2s;
            /* 提示用户可以交互 */
            cursor: pointer; 
            /* 防止手机端点击时的高亮色块 */
            -webkit-tap-highlight-color: transparent; 
        }
        .result-img:hover { transform: scale(1.02); }
        .help-text { font-size: 0.8rem; color: #6B7280; margin-top: 6px; line-height: 1.4; }
        
        .notice-banner {
            background: #EFF6FF;
            border: 1px solid #BFDBFE;
            color: #1D4ED8;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 10px;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
            .result-img { width: 45%; min-width: 120px; }
        }
    </style>
</head>
<body>

<svg style="display: none;">
    <defs>
        <filter id="handDrawnFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence id="svgTurbulence" type="fractalNoise" baseFrequency="0.15" numOctaves="3" result="noise" />
            <feDisplacementMap id="svgDisplacement" in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </defs>
</svg>

<div class="container">
    <div class="panel">
        <h2>🛠️ 基础设置</h2>
        
        <div class="form-group">
            <label>输入文字</label>
            <span class="char-count" id="charCount">0/500</span>
            <textarea id="inputText" maxlength="500" oninput="autoGenerate()" placeholder="输入你想生成的文字...">小王子!</textarea>
        </div>

        <div class="form-group">
            <label>单图字数</label>
            <input type="number" id="charsPerImg" oninput="autoGenerate()" value="1" min="1" max="20">
        </div>

        <div class="flex-row form-group">
            <div>
                <label>文字颜色</label>
                <input type="color" id="textColor" oninput="autoGenerate()" value="#1A1A1A">
            </div>
            <div>
                <label>背景颜色</label>
                <input type="color" id="bgColor" oninput="autoGenerate()" value="#FFFFFF">
            </div>
        </div>

        <div class="form-group">
            <label>选择字体</label>
            <select id="fontFamily" onchange="autoGenerate()">
                <optgroup label="手写 & 毛笔风 (推荐)">
                    <option value="'Ma Shan Zheng', cursive" selected>马善政毛笔</option>
                    <option value="'Zhi Mang Xing', cursive">志莽行书</option>
                    <option value="'Liu Jian Mao Cao', cursive">刘建毛草</option>
                    <option value="'Long Cang', cursive">龙藏体</option>
                </optgroup>
                <optgroup label="经典排版风">
                    <option value="'Noto Serif SC', serif">思源宋体</option>
                    <option value="'Noto Sans SC', sans-serif">思源黑体</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label>图片尺寸 (默认 9:16)</label>
            <div class="flex-row">
                <input type="number" id="imgWidth" oninput="autoGenerate()" value="1080" placeholder="宽">
                <input type="number" id="imgHeight" oninput="autoGenerate()" value="1920" placeholder="高">
            </div>
        </div>

        <h2 style="margin-top: 25px;">✨ 高级手绘参数</h2>
        <label class="toggle-label">
            <input type="checkbox" id="enableHandDrawn" onchange="autoGenerate()" checked>
            开启边缘毛糙手绘效果
        </label>
        
        <div id="advancedControls">
            <div class="slider-group">
                <div class="slider-header"><span>边缘毛糙度</span><span id="valDistortion">5</span></div>
                <input type="range" id="distortionScale" min="0" max="20" step="1" value="5" oninput="updateFilters()">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>笔触颗粒感</span><span id="valNoise">0.15</span></div>
                <input type="range" id="noiseFreq" min="0.01" max="0.3" step="0.01" value="0.15" oninput="updateFilters()">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>文字加粗</span><span id="valStroke">2</span></div>
                <input type="range" id="strokeWidth" min="0" max="40" step="1" value="2" oninput="autoGenerate()">
            </div>
        </div>

        <button class="btn btn-generate" onclick="generateImages()" style="margin-top: 15px;">强制刷新生成</button>
        
        <div id="downloadArea" style="display: none; margin-top: 15px; background: #F9FAFB; padding: 15px; border-radius: 8px; border: 1px solid var(--border);">
            <label class="toggle-label" style="font-size: 0.95rem; color: #1F2937; padding-top: 0; margin-bottom: 8px;">
                <input type="checkbox" id="useZip" onchange="toggleIntervalSetting()">
                打包成 ZIP 压缩包下载
            </label>
            
            <div id="intervalSetting" style="margin-bottom: 12px; padding: 10px; background: #fff; border-radius: 6px; border: 1px solid #E5E7EB;">
                <label style="font-size: 0.85rem; font-weight: bold; color: #4B5563; display: block; margin-bottom: 6px;">
                    普通多图下载间隔 (毫秒)
                </label>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="number" id="downloadInterval" style="width: 100px; padding: 6px; font-size: 0.9rem;" min="0" step="100">
                    <span style="font-size: 0.8rem; color: #6B7280;">(1秒 = 1000毫秒)</span>
                </div>
                <div class="help-text" style="color: #D97706; margin-top: 8px;">
                    💡 备注：多图下载易被拦截，已为您提供自动延迟防拦截。若仍失败，请长按右侧预览图保存，或使用 ZIP 打包。<br>
                    <span id="deviceType" style="font-weight:bold; color: #4F46E5;"></span>
                </div>
            </div>

            <button class="btn btn-download" id="dlButton" onclick="downloadAll()">💾 保存所有原图 (电脑/安卓推荐)</button>
            <div id="statusMsg" class="help-text" style="color: #10B981; font-weight: bold; text-align: center; margin-top: 10px;"></div>
        </div>
    </div>

    <div class="panel preview-panel">
        <h2 style="padding: 20px 20px 0 20px; border:none; margin:0;">👀 实时预览图</h2>
        
        <div style="padding: 0 20px;">
            <div class="notice-banner">📱 手机端：可直接长按下方任意图片，选择“保存到相册”。(已为您呈现高清原图画质)</div>
            <div class="help-text" style="margin-top: 10px;">所见即所得。调整左侧参数，这里会实时变化。</div>
        </div>
        
        <div class="canvas-container" style="padding: 0 20px 20px 20px;" id="canvasContainer"></div>
        
        <button id="btnLoadMore" class="btn btn-loadmore" onclick="loadMorePreview()">⏬ 加载更多图片</button>
    </div>
</div>

<script>
    let debounceTimer;
    // 每次加载的批次数量
    const BATCH_SIZE = 30; 
    // 记录当前已渲染到第几张
    let currentRenderIndex = 0; 

    function initDeviceSettings() {
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const intervalInput = document.getElementById('downloadInterval');
        const deviceTypeSpan = document.getElementById('deviceType');
        
        if (isMobile) {
            intervalInput.value = 1000;
            deviceTypeSpan.innerText = '已识别为手机端，建议延迟保持 1000ms 左右。';
        } else {
            intervalInput.value = 200;
            deviceTypeSpan.innerText = '已识别为电脑端，可设为 200ms 加快速度。';
        }
    }

    function toggleIntervalSetting() {
        const isZip = document.getElementById('useZip').checked;
        document.getElementById('intervalSetting').style.display = isZip ? 'none' : 'block';
    }

    function splitText(text) { return Array.from(text); }

    function updateFilters() {
        const scale = document.getElementById('distortionScale').value;
        const freq = document.getElementById('noiseFreq').value;
        document.getElementById('valDistortion').innerText = scale;
        document.getElementById('valNoise').innerText = freq;
        document.getElementById('svgDisplacement').setAttribute('scale', scale);
        document.getElementById('svgTurbulence').setAttribute('baseFrequency', freq);
        autoGenerate(); 
    }

    function autoGenerate() {
        const textVal = document.getElementById('inputText').value;
        document.getElementById('charCount').innerText = `${textVal.length}/500`;
        document.getElementById('valStroke').innerText = document.getElementById('strokeWidth').value;
        
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => { generateImages(); }, 300); 
    }

    function drawOnCanvas(canvas, groupText, config) {
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = config.bgColor;
        ctx.fillRect(0, 0, config.width, config.height);
        
        const maxFontSizeByWidth = (config.width / groupText.length) * 0.85; 
        const maxFontSizeByHeight = config.height * 0.8;
        const fontSize = Math.min(maxFontSizeByWidth, maxFontSizeByHeight);
        
        ctx.font = `${fontSize}px ${config.fontFamily}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        if (config.isHandDrawn) ctx.filter = 'url(#handDrawnFilter)';
        else ctx.filter = 'none';

        ctx.fillStyle = config.textColor;
        ctx.fillText(groupText, config.width / 2, config.height / 2);
        
        if (config.extraStroke > 0) {
            ctx.strokeStyle = config.textColor;
            ctx.lineWidth = config.extraStroke;
            ctx.lineJoin = 'round';
            ctx.strokeText(groupText, config.width / 2, config.height / 2);
        }
        ctx.filter = 'none';
    }

    function getConfig() {
        return {
            textColor: document.getElementById('textColor').value,
            bgColor: document.getElementById('bgColor').value,
            fontFamily: document.getElementById('fontFamily').value,
            width: parseInt(document.getElementById('imgWidth').value) || 1080,
            height: parseInt(document.getElementById('imgHeight').value) || 1920,
            isHandDrawn: document.getElementById('enableHandDrawn').checked,
            extraStroke: parseInt(document.getElementById('strokeWidth').value) || 0
        };
    }

    function generateImages() {
        const text = document.getElementById('inputText').value.replace(/\n/g, ''); 
        const charsPerImg = parseInt(document.getElementById('charsPerImg').value) || 1;
        const container = document.getElementById('canvasContainer');
        const downloadArea = document.getElementById('downloadArea');
        const btnLoadMore = document.getElementById('btnLoadMore');
        
        container.innerHTML = '';
        btnLoadMore.style.display = 'none';
        currentRenderIndex = 0; // 重置进度

        if (!text) {
            container.innerHTML = '<div style="color:#9CA3AF; padding: 20px;">等待输入文字...</div>';
            downloadArea.style.display = 'none';
            return;
        }

        const chars = splitText(text);
        const groups = [];
        for (let i = 0; i < chars.length; i += charsPerImg) {
            groups.push(chars.slice(i, i + charsPerImg).join(''));
        }

        window.__currentGroups = groups;

        if (groups.length > 0) {
            downloadArea.style.display = 'block';
            loadMorePreview(); // 首次渲染第一批
        }
    }

    // 分批次渲染为真正的 <img> 标签
    function loadMorePreview() {
        const container = document.getElementById('canvasContainer');
        const btnLoadMore = document.getElementById('btnLoadMore');
        const groups = window.__currentGroups;
        const config = getConfig();

        // 计算当前批次的结束索引
        const endIndex = Math.min(currentRenderIndex + BATCH_SIZE, groups.length);
        
        for (let i = currentRenderIndex; i < endIndex; i++) {
            // 使用临时 Canvas 绘图
            const canvas = document.createElement('canvas');
            canvas.width = config.width;
            canvas.height = config.height;
            drawOnCanvas(canvas, groups[i], config);
            
            // 转化为 <img>，这样移动端就能直接长按保存了
            const img = document.createElement('img');
            img.className = 'result-img';
            img.src = canvas.toDataURL('image/png', 1.0);
            img.alt = `预览图 ${i + 1}`;
            
            container.appendChild(img);
            
            // 立即释放 Canvas 内存
            canvas.width = 0;
            canvas.height = 0;
        }

        currentRenderIndex = endIndex;

        // 如果还没渲染完，显示加载更多按钮
        if (currentRenderIndex < groups.length) {
            btnLoadMore.style.display = 'block';
            btnLoadMore.innerText = `⏬ 加载更多图片 (已展示 ${currentRenderIndex} / ${groups.length})`;
        } else {
            btnLoadMore.style.display = 'none';
        }
    }

    function generateDataUrlAsync(groupText, config) {
        return new Promise((resolve) => {
            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = config.width;
                canvas.height = config.height;
                drawOnCanvas(canvas, groupText, config);
                const dataUrl = canvas.toDataURL('image/png', 1.0);
                canvas.width = 0;
                canvas.height = 0; 
                resolve(dataUrl);
            }, 10); 
        });
    }

    async function downloadAll() {
        const groups = window.__currentGroups;
        if (!groups || groups.length === 0) return;

        const isZip = document.getElementById('useZip').checked;
        const textPrefix = document.getElementById('inputText').value.substring(0, 2) || "文字";
        const config = getConfig();
        const statusMsg = document.getElementById('statusMsg');
        const dlButton = document.getElementById('dlButton');
        const userDelay = parseInt(document.getElementById('downloadInterval').value) || 200;

        if (!isZip && groups.length > 30) {
            alert(`数量极多 (${groups.length}张)，逐张下载大概率会导致浏览器崩溃或被拦截拦截。已强制为您勾选“打包成 ZIP”！`);
            document.getElementById('useZip').checked = true;
            toggleIntervalSetting();
            return;
        }

        dlButton.disabled = true;

        if (isZip) {
            statusMsg.innerHTML = "📦 后台拼命生成和压缩中，请不要关闭页面...";
            try {
                const zip = new JSZip();
                for (let i = 0; i < groups.length; i++) {
                    const fileIndex = (i + 1).toString().padStart(3, '0');
                    statusMsg.innerHTML = `📦 正在生成第 ${i+1}/${groups.length} 张...`;
                    
                    const dataUrl = await generateDataUrlAsync(groups[i], config);
                    const base64Data = dataUrl.replace(/^data:image\/(png|jpg);base64,/, "");
                    zip.file(`手绘文字_${textPrefix}_${fileIndex}.png`, base64Data, {base64: true});
                }
                statusMsg.innerHTML = "📦 图片生成完毕，正在打包 ZIP (这可能需要几秒钟)...";
                const content = await zip.generateAsync({type:"blob"});
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `手绘文字_${textPrefix}_打包.zip`;
                link.click();
                
                setTimeout(() => URL.revokeObjectURL(link.href), 5000); 
                statusMsg.innerHTML = "✅ ZIP 压缩包下载完成！";
            } catch (error) {
                console.error(error);
                statusMsg.innerHTML = "❌ 打包失败，内容可能过多。";
            }
        } else {
            statusMsg.innerHTML = "⬇️ 逐张后台生成并保存中，请允许浏览器多文件下载...";
            for (let i = 0; i < groups.length; i++) {
                const fileIndex = (i + 1).toString().padStart(3, '0');
                const dataUrl = await generateDataUrlAsync(groups[i], config);
                
                const link = document.createElement('a');
                link.download = `手绘文字_${textPrefix}_${fileIndex}.png`;
                link.href = dataUrl;
                link.click();
                
                await new Promise(r => setTimeout(r, userDelay));
            }
            statusMsg.innerHTML = "✅ 全部保存完成！";
        }

        dlButton.disabled = false;
        setTimeout(() => statusMsg.innerHTML = "", 5000);
    }

    window.onload = () => { 
        initDeviceSettings(); 
        setTimeout(autoGenerate, 200); 
    };
</script>

</body>
</html>
