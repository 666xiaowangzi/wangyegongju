<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF 超级分割工具 (小王子)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .line-col, .line-row { position: absolute; z-index: 50; touch-action: none; will-change: left, top; }
        .line-col { top: 0; bottom: 0; width: 2px; background: #ef4444; cursor: col-resize; }
        .line-row { left: 0; right: 0; height: 2px; background: #3b82f6; cursor: row-resize; }
        .line-col::after { content: ''; position: absolute; left: -15px; right: -15px; top: 0; bottom: 0; }
        .line-row::after { content: ''; position: absolute; top: -15px; bottom: -15px; left: 0; right: 0; }
        .active { box-shadow: 0 0 12px currentColor; background: currentColor; width: 4px; height: 4px; z-index: 60; }
        .loading-overlay { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); }
        .modal-enter { animation: pop 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .accordion-content { transition: all 0.3s; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 500px; opacity: 1; }
        
        /* 修复：添加移动端设置面板的动画样式 */
        .mobile-settings-panel { transition: all 0.3s ease-in-out; overflow: hidden; max-height: 80vh; opacity: 1; }
        .mobile-settings-panel.closed { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; }
        
        @media (min-width: 768px) { .mobile-settings-panel { display: block !important; max-height: none !important; opacity: 1 !important; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col pb-24 md:pb-10">
    <header class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-[100] border-b border-slate-100">
        <div class="container mx-auto px-4 h-14 md:h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-base md:text-lg font-bold text-slate-800 leading-tight" data-i18n="appTitle">PDF 超级分割</h1>
                    <span class="text-[10px] text-indigo-500 font-bold tracking-wide uppercase" data-i18n="appSubtitle">小王子</span>
                </div>
            </div>
            <div class="flex items-center gap-2 md:gap-3">
                <button onclick="toggleLanguage()" class="flex items-center gap-1 text-slate-500 border border-slate-200 bg-white px-2 py-1 rounded-lg text-xs font-bold transition active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                    <span id="lang-text">EN</span>
                </button>
                <div class="hidden md:flex items-center gap-2">
                    <button onclick="document.getElementById('add-file-input').click()" class="bg-indigo-50 text-indigo-700 border border-indigo-100 px-3 py-1.5 rounded-lg text-xs font-bold" data-i18n="addFile">添加</button>
                    <button onclick="openPreviewConsole()" class="bg-emerald-50 text-emerald-700 border border-emerald-100 px-3 py-1.5 rounded-lg text-xs font-bold" data-i18n="preview">预演</button>
                    <button onclick="processAndDownload()" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-md" data-i18n="download">下载</button>
                    <button onclick="resetAll()" class="text-slate-400 p-1.5 hover:text-red-500" title="清空"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 pt-6 flex flex-col items-center">
        <div id="global-toolbar" class="hidden w-full max-w-5xl mb-6 p-1 pr-2 bg-white rounded-2xl shadow-sm border border-slate-100 flex-wrap justify-between items-center gap-2 animate-[fadeIn_0.3s]">
            <div class="flex items-center gap-2 px-3 py-2 bg-indigo-50 rounded-xl">
                <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span class="text-sm text-indigo-900 font-bold" data-i18n="batchSettings">批量设置</span>
            </div>
            <div class="flex items-center gap-2 flex-grow justify-end">
                <div class="flex items-center border border-slate-200 rounded-lg bg-white px-2 py-1"><span class="text-[10px] text-red-500 font-bold uppercase mr-1" data-i18n="cols">列数</span><input type="number" id="global-col" value="1" min="1" class="w-8 text-center text-sm font-bold outline-none"></div>
                <div class="flex items-center border border-slate-200 rounded-lg bg-white px-2 py-1"><span class="text-[10px] text-blue-500 font-bold uppercase mr-1" data-i18n="rows">行数</span><input type="number" id="global-row" value="1" min="1" class="w-8 text-center text-sm font-bold outline-none"></div>
                <button onclick="applyGlobalDirect()" class="bg-slate-800 text-white px-4 py-1.5 rounded-lg text-xs" data-i18n="applyAll">应用到全部</button>
            </div>
        </div>

        <div id="upload-area" class="w-full max-w-xl mt-8">
            <div class="group relative border-2 border-dashed border-indigo-200 rounded-3xl bg-white p-10 text-center hover:border-indigo-400 transition-all cursor-pointer shadow-sm" id="drop-zone">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                <h2 class="text-xl font-bold text-slate-700" data-i18n="clickUpload">点击添加 PDF 或图片</h2>
                <p class="text-sm text-slate-400 mt-2" data-i18n="slogan">小王子为你施展分割魔法</p>
                <div class="absolute inset-0 z-10"></div>
            </div>
            <div class="mt-8 space-y-3 px-2">
                <a id="pdfcraft-link" href="https://pdfcraft.devtoolcafe.com/zh/" target="_blank" class="flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm border border-slate-100 hover:border-indigo-200 transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500 shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-width="2"></path></svg></div>
                        <div class="text-left"><div class="text-sm font-bold text-slate-700">PDFCraft</div><div class="text-xs text-slate-400" data-i18n="pdfcraftDesc">极致轻便的 PDF 在线处理工具箱</div></div>
                    </div>
                </a>
                <a href="https://tools.pdf24.org/zh/" target="_blank" class="flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm border border-slate-100 hover:border-blue-200 transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-width="2"></path></svg></div>
                        <div class="text-left"><div class="text-sm font-bold text-slate-700">PDF24</div><div class="text-xs text-slate-400" data-i18n="pdf24Desc">免费且功能强大的离线级工具</div></div>
                    </div>
                </a>
            </div>
        </div>
        <div id="pages-container" class="w-full max-w-5xl flex flex-col gap-5 hidden pb-20"></div>
    </main>

    <div id="bottom-bar" class="hidden fixed bottom-6 left-4 right-4 z-[90] flex justify-end items-center gap-2 md:hidden">
        <div class="bg-white/90 backdrop-blur-md border border-slate-200 rounded-2xl shadow-2xl p-2 flex gap-2">
            <button onclick="resetAll()" class="w-8 h-8 text-red-400 bg-red-50 rounded-lg flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2"></path></svg></button>
            <div class="w-px bg-slate-200 h-8 mx-1"></div>
            <button onclick="document.getElementById('add-file-input').click()" class="px-2 text-slate-500 flex flex-col items-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2"></path></svg><span class="text-[9px] font-bold" data-i18n="addFile">添加</span></button>
            <button onclick="openPreviewConsole()" class="px-2 text-emerald-600 flex flex-col items-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-width="2"></path><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-width="2"></path></svg><span class="text-[9px] font-bold" data-i18n="preview">预演</span></button>
            <button onclick="processAndDownload()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold" data-i18n="download">下载</button>
        </div>
    </div>

    <div id="preview-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/90 p-4">
        <div class="bg-white w-full max-w-6xl h-[90vh] rounded-2xl shadow-2xl flex flex-col md:flex-row overflow-hidden modal-enter">
            <div class="w-full md:w-80 bg-slate-50 border-r border-slate-200 flex flex-col shrink-0">
                <div class="p-4 border-b bg-white flex justify-between items-center cursor-pointer md:cursor-default" onclick="toggleMobileSettings()">
                    <div><h3 class="font-bold text-lg text-slate-800" data-i18n="previewConsole">高级输出控制台</h3><p class="text-xs text-slate-400 hidden md:block" data-i18n="consoleDesc">调整参数后点击刷新</p></div>
                    <div class="md:hidden flex items-center gap-2 text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg"><span class="text-xs font-bold" data-i18n="settingsToggle">设置</span><svg id="mobile-toggle-icon" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2"></path></svg></div>
                </div>
                <div id="settings-container" class="mobile-settings-panel flex-grow p-4 space-y-3 closed">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <button onclick="toggleAccordion('acc-order')" class="w-full px-4 py-3 flex items-center justify-between"><div class="flex items-center gap-2"><svg class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" stroke-width="2"></path></svg><span class="text-sm font-bold" data-i18n="sliceOrder">切片排序</span></div><svg id="icon-acc-order" class="w-4 h-4 text-slate-400 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 9l-7 7-7-7" stroke-width="2"></path></svg></button>
                        <div id="acc-order" class="accordion-content"><div class="p-4"><select id="preview-order-select" class="w-full border rounded-lg px-3 py-2 text-sm font-bold"><option value="row" data-i18n="orderRow">行优先 (Z字形)</option><option value="col" data-i18n="orderCol">列优先 (N字形)</option></select></div></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <button onclick="toggleAccordion('acc-rot')" class="w-full px-4 py-3 flex items-center justify-between"><div class="flex items-center gap-2"><svg class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="2"></path></svg><span class="text-sm font-bold" data-i18n="sliceRotation">切片后旋转</span></div><svg id="icon-acc-rot" class="w-4 h-4 text-slate-400 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 9l-7 7-7-7" stroke-width="2"></path></svg></button>
                        <div id="acc-rot" class="accordion-content"><div class="p-4 flex gap-2"><button onclick="setPreviewRotation(0)" class="rot-btn flex-1 py-1.5 rounded-lg border text-xs font-bold bg-indigo-600 text-white" data-val="0">0°</button><button onclick="setPreviewRotation(90)" class="rot-btn flex-1 py-1.5 rounded-lg border text-xs font-bold" data-val="90">90°</button><button onclick="setPreviewRotation(180)" class="rot-btn flex-1 py-1.5 rounded-lg border text-xs font-bold" data-val="180">180°</button><button onclick="setPreviewRotation(270)" class="rot-btn flex-1 py-1.5 rounded-lg border text-xs font-bold" data-val="270">270°</button></div></div>
                    </div>
                    <button onclick="refreshPreview()" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold flex items-center justify-center gap-2"><svg class="w-4 h-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="2"></path></svg><span data-i18n="refreshPreview">刷新预览 / 生效</span></button>
                </div>
                <!-- 移除了原有的移动端关闭按钮，合并到底部栏 -->
                <div class="hidden p-4 border-t bg-white md:hidden"></div> 
            </div>
            <div class="flex-grow flex flex-col bg-slate-100 overflow-hidden relative">
                <div id="preview-content" class="flex-grow overflow-y-auto p-4 md:p-8 flex flex-col items-center gap-6"></div>
                <div class="p-4 bg-white border-t flex justify-between items-center shrink-0 z-20">
                    <button id="preview-more-btn" onclick="renderMorePreview()" class="hidden px-4 py-2 text-indigo-600 text-sm font-bold flex items-center gap-2"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 13l-7 7-7-7" stroke-width="2"></path></svg><span data-i18n="loadMore">加载更多</span></button>
                    <div class="flex gap-2 ml-auto">
                        <!-- 下载按钮放在左侧 -->
                        <button onclick="processAndDownload()" class="px-4 md:px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl font-bold flex items-center gap-2"><span data-i18n="downloadPDF">下载 PDF</span></button>
                        <!-- 继续编辑按钮放在右侧，并在移动端显示 -->
                        <button onclick="closePreview()" class="px-3 md:px-5 py-2.5 text-slate-500 font-bold hover:bg-slate-100 rounded-xl transition" data-i18n="close">继续编辑</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="copy-modal" class="hidden fixed inset-0 z-[150] flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 modal-enter">
            <div class="flex justify-between items-center mb-6"><h3 class="text-lg font-bold" data-i18n="applySettings">应用分割参数</h3><button onclick="closeCopyModal()" class="p-2 bg-slate-100 rounded-full">✕</button></div>
            <div class="space-y-3 mb-8">
                <label class="flex items-center gap-4 p-4 border rounded-xl cursor-pointer"><input type="radio" name="copy-target" value="all" class="w-5 h-5"><span data-i18n="allPages">所有页面</span></label>
                <label class="flex items-center gap-4 p-4 border rounded-xl cursor-pointer"><input type="radio" name="copy-target" value="current-file" class="w-5 h-5"><span data-i18n="currentFile">仅当前文件</span></label>
                <label class="flex flex-col p-4 border rounded-xl cursor-pointer"><div class="flex items-center gap-4 mb-3"><input type="radio" name="copy-target" value="range" class="w-5 h-5" checked><span data-i18n="pageRange">指定页码范围</span></div><input type="text" id="range-input" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="1-5, 8"></label>
            </div>
            <button onclick="executeCopy()" class="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold" data-i18n="confirmApply">确认应用</button>
        </div>
    </div>

    <div id="loading" class="hidden fixed inset-0 z-[300] flex items-center justify-center loading-overlay">
        <div class="bg-white/90 px-8 py-6 rounded-2xl shadow-xl flex flex-col items-center">
            <div class="w-12 h-12 mb-4 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p id="loading-text" class="text-slate-700 font-bold" data-i18n="loadingMagic">正在施展分割魔法...</p>
        </div>
    </div>

    <input type="file" id="add-file-input" accept="application/pdf,image/*" multiple class="hidden" />

    <script>
        const state = { documents: [], pages: [], nextDocId: 1, drag: { active: false }, outputSettings: { rotation: 0, sortOrder: 'row' }, previewPdfDoc: null, previewPageNum: 1, copySourceIndex: -1 };
        const els = { fileInput: document.getElementById('add-file-input'), uploadArea: document.getElementById('upload-area'), dropZone: document.getElementById('drop-zone'), pagesContainer: document.getElementById('pages-container'), loading: document.getElementById('loading'), loadingText: document.getElementById('loading-text'), modal: document.getElementById('copy-modal'), previewModal: document.getElementById('preview-modal'), previewContent: document.getElementById('preview-content'), previewMoreBtn: document.getElementById('preview-more-btn'), globalToolbar: document.getElementById('global-toolbar'), bottomBar: document.getElementById('bottom-bar') };

        function t(k) { return i18n[currentLang][k] || k; }
        function toggleLanguage() { currentLang = currentLang === 'zh' ? 'en' : 'zh'; updateUI(); }
        function updateUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = t(el.dataset.i18n));
            document.getElementById('lang-text').innerText = currentLang === 'zh' ? 'EN' : '中';
            const link = document.getElementById('pdfcraft-link');
            if (link) link.href = `https://pdfcraft.devtoolcafe.com/${currentLang === 'zh' ? 'zh/' : ''}`;
        }

        els.dropZone.onclick = () => els.fileInput.click();
        els.fileInput.onchange = e => handleFiles(e.target.files);
        els.dropZone.ondrop = e => { e.preventDefault(); handleFiles(e.dataTransfer.files); };
        ['dragover', 'dragenter'].forEach(v => els.dropZone['on'+v] = e => { e.preventDefault(); els.dropZone.classList.add('border-indigo-500'); });

        async function handleFiles(files) {
            if (!files.length) return;
            showLoading(t('parsing'));
            [els.uploadArea, els.pagesContainer, els.globalToolbar, els.bottomBar].forEach(el => el.classList.toggle('hidden', el === els.uploadArea));
            try {
                for (const file of files) {
                    let doc = null, storage = file;
                    if (file.type === 'application/pdf') {
                        doc = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                    } else if (file.type.startsWith('image/')) {
                        const bytes = await imageToPdfBytes(file);
                        storage = new Blob([bytes], {type:'application/pdf'}); storage.name = file.name;
                        doc = await pdfjsLib.getDocument(bytes).promise;
                    } else continue;
                    const docId = state.nextDocId++;
                    state.documents.push({ id: docId, file: storage, pdfDoc: doc, fileName: file.name });
                    for (let i = 1; i <= doc.numPages; i++) {
                        const idx = state.pages.length;
                        state.pages.push({ docId, pageIndexInDoc: i, cols: [], rows: [], rendered: false });
                        createPageCard(idx);
                    }
                }
            } catch (e) { alert(t('alertParseError') + e.message); } finally { hideLoading(); els.fileInput.value = ''; }
        }

        async function imageToPdfBytes(file) {
            const pdf = await PDFLib.PDFDocument.create();
            const buf = await file.arrayBuffer();
            const img = file.type === 'image/png' ? await pdf.embedPng(buf) : await pdf.embedJpg(buf);
            const page = pdf.addPage([img.width, img.height]);
            page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
            return await pdf.save();
        }

        const observer = new IntersectionObserver(entries => entries.forEach(e => {
            if (e.isIntersecting) { renderPageCanvas(parseInt(e.target.dataset.index)); observer.unobserve(e.target); }
        }), { rootMargin: '300px' });

        function createPageCard(idx) {
            const p = state.pages[idx], d = state.documents.find(doc => doc.id === p.docId);
            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden";
            card.innerHTML = `
                <div class="bg-slate-50/80 border-b p-3 flex justify-between items-center">
                    <div class="flex items-center gap-2 truncate"><span class="w-6 h-6 bg-white rounded-full flex items-center justify-center text-xs font-bold">${idx+1}</span><span class="text-xs text-slate-400 truncate">${d.fileName}</span></div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-white rounded border p-0.5"><input type="number" id="in-col-${idx}" value="1" min="1" class="w-5 text-center text-xs" onchange="updatePageSplit(${idx})"><span class="text-slate-300 text-[10px]">x</span><input type="number" id="in-row-${idx}" value="1" min="1" class="w-5 text-center text-xs" onchange="updatePageSplit(${idx})"></div>
                        <button onclick="openCopyModal(${idx})" class="p-1.5 text-indigo-500 text-xs font-bold" data-i18n="copy">${t('copy')}</button>
                    </div>
                </div>
                <div class="bg-slate-100 flex justify-center relative min-h-[200px]"><div class="relative shadow-lg bg-white my-4 lazy-canvas select-none" data-index="${idx}"><canvas id="canvas-${idx}" class="block max-w-full pointer-events-none"></canvas><div id="overlay-${idx}" class="absolute inset-0 z-10"></div><div id="ph-${idx}" class="absolute inset-0 flex items-center justify-center text-xs text-slate-400">${t('loading')}</div></div></div>`;
            els.pagesContainer.appendChild(card); observer.observe(card.querySelector('.lazy-canvas'));
        }

        async function renderPageCanvas(idx) {
            const p = state.pages[idx], d = state.documents.find(doc => doc.id === p.docId);
            const page = await d.pdfDoc.getPage(p.pageIndexInDoc);
            const canvas = document.getElementById(`canvas-${idx}`), vp = page.getViewport({ scale: 1.0 });
            const scale = Math.min(window.innerWidth - 32, 800) / vp.width, svp = page.getViewport({ scale });
            canvas.height = svp.height; canvas.width = svp.width;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: svp }).promise;
            document.getElementById(`ph-${idx}`).remove(); p.rendered = true; renderLines(idx);
        }

        function renderLines(idx) {
            const overlay = document.getElementById(`overlay-${idx}`), p = state.pages[idx];
            overlay.innerHTML = '';
            const add = (pct, type, i) => {
                const l = document.createElement('div'); l.className = type === 'col' ? 'line-col' : 'line-row';
                l.style[type === 'col' ? 'left' : 'top'] = (pct * 100) + '%';
                l.onmousedown = l.ontouchstart = e => { if(e.touches) e.preventDefault(); startDrag(e.touches?e.touches[0]:e, type, idx, i, l); };
                overlay.appendChild(l);
            };
            p.cols.forEach((v, i) => add(v, 'col', i)); p.rows.forEach((v, i) => add(v, 'row', i));
        }

        function startDrag(e, type, gIdx, lIdx, el) { state.drag = { active: true, type, gIdx, lIdx, el }; el.classList.add('active'); }
        window.onmousemove = window.ontouchmove = e => {
            const d = state.drag; if (!d.active) return;
            const rect = document.getElementById(`overlay-${d.gIdx}`).getBoundingClientRect(), move = e.touches ? e.touches[0] : e;
            const pct = d.type === 'col' ? Math.max(0, Math.min(move.clientX - rect.left, rect.width)) / rect.width : Math.max(0, Math.min(move.clientY - rect.top, rect.height)) / rect.height;
            state.pages[d.gIdx][d.type === 'col' ? 'cols' : 'rows'][d.lIdx] = pct;
            d.el.style[d.type === 'col' ? 'left' : 'top'] = (pct * 100) + '%';
        };
        window.onmouseup = window.ontouchend = () => { if(state.drag.active) state.drag.el.classList.remove('active'); state.drag.active = false; };

        window.updatePageSplit = idx => {
            const c = parseInt(document.getElementById(`in-col-${idx}`).value) || 1, r = parseInt(document.getElementById(`in-row-${idx}`).value) || 1;
            state.pages[idx].cols = Array.from({length: c-1}, (_, i) => (i+1)/c);
            state.pages[idx].rows = Array.from({length: r-1}, (_, i) => (i+1)/r);
            renderLines(idx);
        };

        window.applyGlobalDirect = () => {
            const c = parseInt(document.getElementById('global-col').value) || 1, r = parseInt(document.getElementById('global-row').value) || 1;
            state.pages.forEach((p, i) => {
                p.cols = Array.from({length: c-1}, (_, j) => (j+1)/c); p.rows = Array.from({length: r-1}, (_, j) => (j+1)/r);
                document.getElementById(`in-col-${i}`).value = c; document.getElementById(`in-row-${i}`).value = r;
                if(p.rendered) renderLines(i);
            });
        };

        window.openCopyModal = idx => { state.copySourceIndex = idx; els.modal.classList.remove('hidden'); };
        window.closeCopyModal = () => els.modal.classList.add('hidden');
        window.executeCopy = () => {
            const src = state.pages[state.copySourceIndex], type = document.querySelector('input[name="copy-target"]:checked').value;
            let targets = [];
            if(type === 'all') targets = state.pages.map((_,i)=>i);
            else if(type === 'current-file') targets = state.pages.map((p,i) => p.docId === src.docId ? i : -1).filter(i=>i!==-1);
            else {
                document.getElementById('range-input').value.split(/[,，]/).forEach(v => {
                    const [s,e] = v.split('-').map(Number);
                    if(e) for(let i=s; i<=e; i++) targets.push(i-1); else if(s) targets.push(s-1);
                });
            }
            targets.forEach(i => { if(state.pages[i]) { state.pages[i].cols = [...src.cols]; state.pages[i].rows = [...src.rows]; document.getElementById(`in-col-${i}`).value = src.cols.length+1; document.getElementById(`in-row-${i}`).value = src.rows.length+1; if(state.pages[i].rendered) renderLines(i); } });
            closeCopyModal();
        };

        window.toggleAccordion = id => { document.getElementById(id).classList.toggle('open'); document.getElementById('icon-'+id).classList.toggle('rotate-180'); };
        window.toggleMobileSettings = () => { document.getElementById('settings-container').classList.toggle('closed'); document.getElementById('mobile-toggle-icon').classList.toggle('rotate-180'); };
        window.setPreviewRotation = deg => { state.outputSettings.rotation = deg; document.querySelectorAll('.rot-btn').forEach(b => b.classList.toggle('bg-indigo-600', Number(b.dataset.val) === deg)); document.querySelectorAll('.rot-btn').forEach(b => b.classList.toggle('text-white', Number(b.dataset.val) === deg)); };

        window.refreshPreview = async () => {
            state.outputSettings.sortOrder = document.getElementById('preview-order-select').value;
            state.previewPageNum = 1; els.previewContent.innerHTML = '';
            showLoading(t('loadingMagic'));
            setTimeout(async () => { try { state.previewPdfDoc = await generateFinalPDF(); await renderMorePreview(); } catch(e) { alert(e.message); } finally { hideLoading(); } }, 50);
        };

        async function generateFinalPDF() {
            const out = await PDFLib.PDFDocument.create(), cache = {};
            const slices = [];
            for (const p of state.pages) {
                const d = state.documents.find(doc => doc.id === p.docId);
                if (!cache[p.docId]) cache[p.docId] = await PDFLib.PDFDocument.load(await d.file.arrayBuffer());
                const srcPage = cache[p.docId].getPages()[p.pageIndexInDoc - 1], { width, height } = srcPage.getSize();
                const cs = [0, ...p.cols.sort((a,b)=>a-b), 1], rs = [0, ...p.rows.sort((a,b)=>a-b), 1];
                const pageSlices = [];
                for(let r=0; r<rs.length-1; r++) {
                    for(let c=0; c<cs.length-1; c++) {
                        const x = cs[c]*width, y = height*(1-rs[r+1]), w = (cs[c+1]-cs[c])*width, h = (rs[r+1]-rs[r])*height;
                        const sDoc = await PDFLib.PDFDocument.create();
                        const [cp] = await sDoc.copyPages(cache[p.docId], [p.pageIndexInDoc-1]);
                        cp.setCropBox(x, y, w, h); sDoc.addPage(cp);
                        pageSlices.push(await PDFLib.PDFDocument.load(await sDoc.save()));
                    }
                }
                if (state.outputSettings.sortOrder === 'col') {
                    const rowCount = rs.length-1, colCount = cs.length-1, reordered = [];
                    for(let c=0; c<colCount; c++) for(let r=0; r<rowCount; r++) reordered.push(pageSlices[r*colCount + c]);
                    slices.push(...reordered);
                } else slices.push(...pageSlices);
            }
            for (const s of slices) { const [p] = await out.copyPages(s, [0]); p.setRotation(PDFLib.degrees(state.outputSettings.rotation)); out.addPage(p); }
            return out;
        }

        window.openPreviewConsole = () => { if(state.pages.length) { els.previewModal.classList.remove('hidden'); if(!state.previewPdfDoc) refreshPreview(); } };
        window.renderMorePreview = async () => {
            const pdf = await pdfjsLib.getDocument(await state.previewPdfDoc.save()).promise, start = state.previewPageNum, end = Math.min(start + 1, pdf.numPages);
            for (let i = start; i <= end; i++) {
                const page = await pdf.getPage(i), vp = page.getViewport({ scale: 1.0 });
                const scale = Math.min((els.previewContent.clientWidth*0.9)/vp.width, 1.5), svp = page.getViewport({ scale });
                const canvas = document.createElement('canvas'); canvas.className = "bg-white shadow-lg shrink-0";
                canvas.width = svp.width; canvas.height = svp.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport: svp }).promise;
                els.previewContent.appendChild(canvas);
            }
            state.previewPageNum = end + 1;
            els.previewMoreBtn.classList.toggle('hidden', state.previewPageNum > pdf.numPages);
        };

        window.closePreview = () => els.previewModal.classList.add('hidden');
        async function processAndDownload() {
            showLoading(t('loadingMagic'));
            setTimeout(async () => {
                try {
                    const pdf = await generateFinalPDF(), link = document.createElement('a');
                    link.href = URL.createObjectURL(new Blob([await pdf.save()], {type:'application/pdf'}));
                    link.download = `LittlePrince_Cut_${new Date().toISOString().slice(0,10)}.pdf`; link.click();
                } catch(e) { alert(e.message); } finally { hideLoading(); }
            }, 50);
        }

        window.resetAll = () => confirm(t('alertClear')) && location.reload();
        function showLoading(txt) { els.loadingText.textContent = txt; els.loading.classList.remove('hidden'); }
        function hideLoading() { els.loading.classList.add('hidden'); }

        let currentLang = 'zh';
        const i18n = {
            zh: { appTitle: "PDF 超级分割工具", appSubtitle: "小王子", addFile: "添加", download: "下载", preview: "预演", batchSettings: "批量分割", cols: "列数", rows: "行数", applyAll: "应用到全部", clickUpload: "点击添加 PDF 或图片", slogan: "小王子为你施展分割魔法", pdfcraftDesc: "极致轻便的 PDF 在线处理工具箱", pdf24Desc: "免费且功能强大的离线级工具", applySettings: "应用分割参数", allPages: "所有页面", currentFile: "仅当前文件", pageRange: "页码范围", confirmApply: "确认应用", loadingMagic: "正在施展魔法...", parsing: "正在解析...", copy: "复制", loading: "加载中...", alertParseError: "失败: ", alertClear: "确定清空吗？", previewConsole: "高级输出控制台", consoleDesc: "调整后刷新", close: "继续编辑", loadMore: "加载更多", sliceRotation: "切片旋转", sliceOrder: "切片排序", orderRow: "行优先 (Z字)", orderCol: "列优先 (N字)", refreshPreview: "刷新预览", downloadPDF: "下载 PDF", settingsToggle: "设置" },
            en: { appTitle: "PDF Grid Cutter", appSubtitle: "Little Prince", addFile: "Add", download: "DL", preview: "Preview", batchSettings: "Batch", cols: "Cols", rows: "Rows", applyAll: "Apply All", clickUpload: "Click/Drag PDF or Images", slogan: "Little Prince casts splitting magic", pdfcraftDesc: "Lightweight PDF online toolbox", pdf24Desc: "Powerful Offline Tools", applySettings: "Apply Settings", allPages: "All Pages", currentFile: "Current File", pageRange: "Range", confirmApply: "Apply", loadingMagic: "Casting magic...", parsing: "Parsing...", copy: "Copy", loading: "Loading...", alertParseError: "Error: ", alertClear: "Clear all?", previewConsole: "Console", consoleDesc: "Refresh to apply", close: "Edit", loadMore: "Load More", sliceRotation: "Rotation", sliceOrder: "Order", orderRow: "Row Major", orderCol: "Col Major", refreshPreview: "Refresh", downloadPDF: "Download PDF", settingsToggle: "Settings" }
        };
        updateUI();
    </script>
</body>
