<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 超级分割工具 (小王子)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* 分割线样式 */
        .line-col {
            position: absolute; top: 0; bottom: 0; width: 2px;
            background-color: #ef4444; cursor: col-resize; z-index: 20;
        }
        .line-col::after { content: ''; position: absolute; left: -8px; right: -8px; top: 0; bottom: 0; }
        .line-col:hover, .line-col.active { background-color: #b91c1c; width: 4px; margin-left: -1px; }

        .line-row {
            position: absolute; left: 0; right: 0; height: 2px;
            background-color: #3b82f6; cursor: row-resize; z-index: 21;
        }
        .line-row::after { content: ''; position: absolute; top: -8px; bottom: -8px; left: 0; right: 0; }
        .line-row:hover, .line-row.active { background-color: #1d4ed8; height: 4px; margin-top: -1px; }

        .loading-overlay { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(4px); }
        
        /* 模态框动画 */
        .modal-enter { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans text-slate-800">

    <!-- 顶部导航 -->
    <header class="bg-white shadow sticky top-0 z-50">
        <div class="container mx-auto px-4 h-16 flex justify-between items-center">
            
            <!-- 标题区域 + 外部链接 -->
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-bold text-slate-700 flex items-center gap-2 whitespace-nowrap">
                    <span class="bg-indigo-600 text-white p-1 rounded text-sm">PRO</span>
                    PDF 超级分割（小王子）
                </h1>
                
                <!-- 外部工具链接组 -->
                <div class="hidden lg:flex items-center gap-3 text-sm text-gray-400 border-l pl-4 border-gray-300">
                    <a href="https://www.ilovepdf.com.cn/zh-cn/" target="_blank" rel="noopener noreferrer" class="hover:text-red-500 transition flex items-center gap-1 group" title="iLovePDF">
                        <span class="group-hover:underline">iLovePDF</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                    <span class="text-gray-300">|</span>
                    <a href="https://tools.pdf24.org/zh/" target="_blank" rel="noopener noreferrer" class="hover:text-blue-500 transition flex items-center gap-1 group" title="PDF24 Tools">
                        <span class="group-hover:underline">PDF24 工具箱</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </div>
            </div>

            <!-- 右侧工具栏 -->
            <div class="flex items-center gap-3">
                <!-- 添加文件按钮 -->
                <button onclick="document.getElementById('add-file-input').click()" class="flex items-center gap-1 px-3 py-1.5 bg-white border border-indigo-200 text-indigo-600 rounded hover:bg-indigo-50 transition text-sm font-medium whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span class="hidden sm:inline">添加 PDF</span>
                    <span class="sm:hidden">加文件</span>
                </button>
                <input type="file" id="add-file-input" accept="application/pdf" multiple class="hidden" />

                <!-- 批量均分快捷键 -->
                <div class="hidden md:flex items-center gap-2 bg-gray-50 px-2 py-1 rounded border">
                    <span class="text-xs text-gray-400">全局均分:</span>
                    <input type="number" id="global-col" value="1" min="1" class="w-8 h-6 text-center text-xs border rounded" placeholder="列">
                    <input type="number" id="global-row" value="1" min="1" class="w-8 h-6 text-center text-xs border rounded" placeholder="行">
                    <button onclick="applyGlobalDirect()" class="text-xs bg-gray-200 hover:bg-gray-300 px-2 py-0.5 rounded">应用</button>
                </div>

                <div class="h-6 w-px bg-gray-300 mx-1"></div>

                <button onclick="processAndDownload()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded shadow font-medium text-sm transition flex items-center gap-2 whitespace-nowrap">
                    下载
                </button>
                
                <button onclick="resetAll()" class="text-red-500 hover:bg-red-50 px-2 py-1 rounded text-sm whitespace-nowrap">清空</button>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 flex flex-col items-center">
        
        <!-- 初始上传引导区 -->
        <div id="upload-area" class="w-full max-w-2xl mt-12">
            <div class="border-2 border-dashed border-indigo-200 rounded-2xl bg-white p-12 text-center hover:border-indigo-400 hover:bg-indigo-50 transition-all cursor-pointer shadow-sm relative group" onclick="document.getElementById('add-file-input').click()">
                <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">📂</div>
                <h2 class="text-xl font-bold text-slate-700">点击添加 PDF 文件</h2>
                <p class="text-slate-500 mt-2 text-sm">支持多文件合并、批量参数复制</p>
                
                <!-- 底部友情链接 -->
                <div class="absolute bottom-4 left-0 right-0 flex justify-center gap-6" onclick="event.stopPropagation()">
                    <a href="https://www.ilovepdf.com.cn/zh-cn/" target="_blank" class="text-xs text-gray-400 hover:text-red-500 hover:underline flex items-center gap-1">
                        <img src="https://www.ilovepdf.com/img/favicons-pdf/favicon-16x16.png" class="w-3 h-3 opacity-50" alt=""> iLovePDF
                    </a>
                    <a href="https://tools.pdf24.org/zh/" target="_blank" class="text-xs text-gray-400 hover:text-blue-500 hover:underline flex items-center gap-1">
                        <img src="https://tools.pdf24.org/favicon.ico" class="w-3 h-3 opacity-50" alt=""> PDF24 Tools
                    </a>
                </div>
            </div>
        </div>

        <!-- 页面列表 -->
        <div id="pages-container" class="w-full max-w-5xl flex flex-col gap-6 hidden pb-20"></div>

    </main>

    <!-- 高级复制模态框 -->
    <div id="copy-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 modal-enter mx-4">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-bold text-gray-800">应用分割参数</h3>
                <button onclick="closeCopyModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            
            <p class="text-sm text-gray-600 mb-4">
                当前源页面：<span id="modal-source-page" class="font-bold text-indigo-600">Page 1</span><br>
                参数：竖 <span id="modal-cols-count" class="font-mono">2</span> 列 / 横 <span id="modal-rows-count" class="font-mono">1</span> 行
            </p>

            <div class="space-y-3">
                <label class="flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
                    <input type="radio" name="copy-target" value="all" class="w-4 h-4 text-indigo-600">
                    <div>
                        <div class="font-medium text-gray-700">所有页面</div>
                        <div class="text-xs text-gray-500">将参数应用到所有文件的所有页面</div>
                    </div>
                </label>

                <label class="flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
                    <input type="radio" name="copy-target" value="current-file" class="w-4 h-4 text-indigo-600">
                    <div>
                        <div class="font-medium text-gray-700">仅当前文件</div>
                        <div class="text-xs text-gray-500">应用到 <span id="modal-filename" class="italic">filename.pdf</span> 的所有页面</div>
                    </div>
                </label>

                <label class="flex items-start gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
                    <input type="radio" name="copy-target" value="range" class="w-4 h-4 text-indigo-600 mt-1" checked>
                    <div class="flex-grow">
                        <div class="font-medium text-gray-700">指定全局页码范围</div>
                        <input type="text" id="range-input" placeholder="例如: 1-5, 8, 10-15" class="mt-2 w-full border rounded px-2 py-1 text-sm focus:ring-2 focus:ring-indigo-200 outline-none">
                        <div class="text-xs text-gray-400 mt-1">页码为全局序号 (1 到 <span id="modal-total-pages">10</span>)</div>
                    </div>
                </label>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeCopyModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded text-sm">取消</button>
                <button onclick="executeCopy()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded shadow font-medium text-sm">确认应用</button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden fixed inset-0 z-[100] flex items-center justify-center loading-overlay">
        <div class="bg-white px-6 py-4 rounded-xl shadow-xl flex flex-col items-center">
            <div class="w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-2"></div>
            <p id="loading-text" class="text-gray-700 font-medium">处理中...</p>
        </div>
    </div>

    <script>
        // --- 核心数据结构 ---
        const state = {
            documents: [], // 存储文件对象和对应的PDFDoc { id, file, pdfDoc, fileName, pageCount, startGlobalIndex }
            pages: [],     // 扁平化的页面列表 { globalIndex, docId, pageIndexInDoc, cols:[], rows:[], rendered: false }
            nextDocId: 1,
            drag: { active: false, type: null, globalIndex: -1, lineIndex: -1 },
            copySourceIndex: -1 // 当前正在被复制参数的页面索引
        };

        const els = {
            fileInput: document.getElementById('add-file-input'),
            uploadArea: document.getElementById('upload-area'),
            pagesContainer: document.getElementById('pages-container'),
            loading: document.getElementById('loading'),
            loadingText: document.getElementById('loading-text'),
            modal: document.getElementById('copy-modal'),
            globalCol: document.getElementById('global-col'),
            globalRow: document.getElementById('global-row')
        };

        // --- 懒加载观察器 ---
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const globalIndex = parseInt(entry.target.dataset.index);
                    renderPageCanvas(globalIndex);
                    observer.unobserve(entry.target); // 只渲染一次
                }
            });
        }, { rootMargin: '200px' });

        // --- 事件监听 ---
        els.fileInput.addEventListener('change', handleAddFiles);

        // --- 辅助函数 ---
        function getEvenSplits(n) {
            n = parseInt(n) || 1;
            if (n <= 1) return [];
            return Array.from({length: n-1}, (_, i) => (i+1)/n);
        }

        // --- 文件处理 ---
        async function handleAddFiles(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            showLoading('正在解析文件...');
            els.uploadArea.classList.add('hidden');
            els.pagesContainer.classList.remove('hidden');

            try {
                for (const file of files) {
                    if (file.type !== 'application/pdf') continue;
                    
                    const buffer = await file.arrayBuffer();
                    const pdfDoc = await pdfjsLib.getDocument(buffer).promise;
                    
                    const docId = state.nextDocId++;
                    // const startGlobalIndex = state.pages.length + 1;

                    // 记录文档信息
                    state.documents.push({
                        id: docId,
                        file: file,
                        pdfDoc: pdfDoc,
                        fileName: file.name,
                        pageCount: pdfDoc.numPages
                    });

                    // 扁平化添加页面到 pages 数组
                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        const globalIndex = state.pages.length;
                        state.pages.push({
                            globalIndex: globalIndex,
                            docId: docId,
                            pageIndexInDoc: i, // 1-based
                            cols: [],
                            rows: [],
                            rendered: false
                        });
                        
                        // 创建 DOM 占位符
                        createPageCard(globalIndex);
                    }
                }
            } catch (err) {
                console.error(err);
                alert('解析出错: ' + err.message);
            } finally {
                hideLoading();
                els.fileInput.value = ''; // 允许重复添加同名文件
            }
        }

        // --- DOM 创建 ---
        function createPageCard(globalIndex) {
            const pageData = state.pages[globalIndex];
            const docData = state.documents.find(d => d.id === pageData.docId);
            
            const card = document.createElement('div');
            card.className = "bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden";
            card.id = `card-${globalIndex}`;
            card.innerHTML = `
                <div class="bg-gray-50 border-b px-4 py-2 flex flex-wrap justify-between items-center gap-2">
                    <div class="flex flex-col">
                        <span class="font-bold text-gray-700">Page ${globalIndex + 1}</span>
                        <span class="text-xs text-gray-500 truncate max-w-[150px]" title="${docData.fileName}">${docData.fileName} (P${pageData.pageIndexInDoc})</span>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <!-- 参数输入 -->
                        <div class="flex items-center border bg-white rounded overflow-hidden">
                            <span class="px-2 text-xs text-red-500 font-bold border-r">列</span>
                            <input type="number" id="in-col-${globalIndex}" value="1" min="1" class="w-8 py-1 text-center text-sm outline-none" onchange="updatePageSplit(${globalIndex})">
                        </div>
                        <div class="flex items-center border bg-white rounded overflow-hidden">
                            <span class="px-2 text-xs text-blue-500 font-bold border-r">行</span>
                            <input type="number" id="in-row-${globalIndex}" value="1" min="1" class="w-8 py-1 text-center text-sm outline-none" onchange="updatePageSplit(${globalIndex})">
                        </div>
                        
                        <!-- 复制按钮 -->
                        <button onclick="openCopyModal(${globalIndex})" class="ml-2 text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded hover:bg-indigo-100 border border-indigo-200" title="复制参数到其他页面">
                            复制 / 应用
                        </button>
                    </div>
                </div>

                <div class="bg-gray-200 flex justify-center overflow-auto min-h-[200px] relative">
                    <div class="relative inline-block shadow-lg bg-white my-4 lazy-canvas" data-index="${globalIndex}" style="font-size: 0;">
                        <canvas id="canvas-${globalIndex}" class="block max-w-full"></canvas>
                        <div id="overlay-${globalIndex}" class="absolute inset-0 z-10 touch-none"></div>
                        <div id="placeholder-${globalIndex}" class="absolute inset-0 flex items-center justify-center text-gray-400">
                            加载预览...
                        </div>
                    </div>
                </div>
            `;
            els.pagesContainer.appendChild(card);
            
            // 注册懒加载
            const lazyTarget = card.querySelector('.lazy-canvas');
            observer.observe(lazyTarget);
        }

        // --- 渲染逻辑 ---
        async function renderPageCanvas(globalIndex) {
            const pageData = state.pages[globalIndex];
            const docData = state.documents.find(d => d.id === pageData.docId);
            
            try {
                const page = await docData.pdfDoc.getPage(pageData.pageIndexInDoc);
                const canvas = document.getElementById(`canvas-${globalIndex}`);
                const placeholder = document.getElementById(`placeholder-${globalIndex}`);
                
                const viewportRaw = page.getViewport({ scale: 1.0 });
                // 限制预览图宽度
                const desiredWidth = Math.min(window.innerWidth - 60, 800);
                const scale = desiredWidth / viewportRaw.width;
                const viewport = page.getViewport({ scale: scale });

                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                
                placeholder.remove();
                pageData.rendered = true;
                
                renderLines(globalIndex);

            } catch (err) {
                console.error("渲染Canvas失败", err);
            }
        }

        function renderLines(globalIndex) {
            const overlay = document.getElementById(`overlay-${globalIndex}`);
            if (!overlay) return;
            overlay.innerHTML = '';
            
            const config = state.pages[globalIndex];

            // 竖线
            config.cols.forEach((pct, idx) => {
                const line = document.createElement('div');
                line.className = 'line-col';
                line.style.left = (pct * 100) + '%';
                line.addEventListener('mousedown', (e) => startDrag(e, 'col', globalIndex, idx));
                overlay.appendChild(line);
            });

            // 横线
            config.rows.forEach((pct, idx) => {
                const line = document.createElement('div');
                line.className = 'line-row';
                line.style.top = (pct * 100) + '%';
                line.addEventListener('mousedown', (e) => startDrag(e, 'row', globalIndex, idx));
                overlay.appendChild(line);
            });
        }

        // --- 交互: 更新 & 拖拽 ---
        window.updatePageSplit = (globalIndex) => {
            const colVal = document.getElementById(`in-col-${globalIndex}`).value;
            const rowVal = document.getElementById(`in-row-${globalIndex}`).value;
            
            state.pages[globalIndex].cols = getEvenSplits(colVal);
            state.pages[globalIndex].rows = getEvenSplits(rowVal);
            
            renderLines(globalIndex);
        };

        function startDrag(e, type, gIdx, lIdx) {
            e.stopPropagation();
            state.drag = { active: true, type, globalIndex: gIdx, lineIndex: lIdx };
            e.target.classList.add('active');
        }

        window.addEventListener('mousemove', (e) => {
            if (!state.drag.active) return;
            const { type, globalIndex, lineIndex } = state.drag;
            const overlay = document.getElementById(`overlay-${globalIndex}`);
            if(!overlay) return;

            const rect = overlay.getBoundingClientRect();
            
            if (type === 'col') {
                let x = e.clientX - rect.left;
                x = Math.max(0, Math.min(x, rect.width));
                state.pages[globalIndex].cols[lineIndex] = x / rect.width;
            } else {
                let y = e.clientY - rect.top;
                y = Math.max(0, Math.min(y, rect.height));
                state.pages[globalIndex].rows[lineIndex] = y / rect.height;
            }
            renderLines(globalIndex);
        });

        window.addEventListener('mouseup', () => {
            if (state.drag.active) {
                document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
                state.drag.active = false;
            }
        });

        // --- 全局快捷设置 ---
        window.applyGlobalDirect = () => {
            const cols = getEvenSplits(els.globalCol.value);
            const rows = getEvenSplits(els.globalRow.value);
            
            state.pages.forEach((p, idx) => {
                p.cols = [...cols];
                p.rows = [...rows];
                updateInputUI(idx);
                if(p.rendered) renderLines(idx);
            });
        };

        // --- 高级复制功能 ---
        window.openCopyModal = (globalIndex) => {
            state.copySourceIndex = globalIndex;
            const page = state.pages[globalIndex];
            
            document.getElementById('modal-source-page').textContent = `Page ${globalIndex + 1}`;
            document.getElementById('modal-cols-count').textContent = page.cols.length + 1;
            document.getElementById('modal-rows-count').textContent = page.rows.length + 1;
            
            const doc = state.documents.find(d => d.id === page.docId);
            document.getElementById('modal-filename').textContent = doc.fileName;
            document.getElementById('modal-total-pages').textContent = state.pages.length;
            
            els.modal.classList.remove('hidden');
        };

        window.closeCopyModal = () => {
            els.modal.classList.add('hidden');
        };

        window.executeCopy = () => {
            const sourcePage = state.pages[state.copySourceIndex];
            const targetType = document.querySelector('input[name="copy-target"]:checked').value;
            const cols = [...sourcePage.cols];
            const rows = [...sourcePage.rows];
            
            let targets = [];

            if (targetType === 'all') {
                targets = state.pages.map((_, i) => i);
            } else if (targetType === 'current-file') {
                targets = state.pages
                    .map((p, i) => p.docId === sourcePage.docId ? i : -1)
                    .filter(i => i !== -1);
            } else if (targetType === 'range') {
                const rangeStr = document.getElementById('range-input').value;
                targets = parseRange(rangeStr, state.pages.length);
            }

            targets.forEach(idx => {
                state.pages[idx].cols = [...cols];
                state.pages[idx].rows = [...rows];
                updateInputUI(idx);
                if (state.pages[idx].rendered) renderLines(idx);
            });

            closeCopyModal();
        };

        function parseRange(str, max) {
            const result = new Set();
            const parts = str.split(/[,，]/); // 支持中英文逗号
            
            parts.forEach(part => {
                part = part.trim();
                if (!part) return;
                
                if (part.includes('-')) {
                    const [start, end] = part.split('-').map(Number);
                    if (!isNaN(start) && !isNaN(end)) {
                        for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
                            if (i >= 1 && i <= max) result.add(i - 1);
                        }
                    }
                } else {
                    const num = Number(part);
                    if (!isNaN(num) && num >= 1 && num <= max) result.add(num - 1);
                }
            });
            return Array.from(result);
        }

        function updateInputUI(idx) {
            const p = state.pages[idx];
            document.getElementById(`in-col-${idx}`).value = p.cols.length + 1;
            document.getElementById(`in-row-${idx}`).value = p.rows.length + 1;
        }

        // --- 生成下载 ---
        async function processAndDownload() {
            if (state.pages.length === 0) return;
            showLoading('正在生成合并PDF...');

            setTimeout(async () => {
                try {
                    const newPdf = await PDFLib.PDFDocument.create();
                    
                    // 缓存已加载的 PDFLib Document，避免重复加载 arrayBuffer
                    const loadedDocs = {};

                    for (const pageConfig of state.pages) {
                        const docData = state.documents.find(d => d.id === pageConfig.docId);
                        
                        // 懒加载源文档
                        if (!loadedDocs[docData.id]) {
                            const buffer = await docData.file.arrayBuffer();
                            loadedDocs[docData.id] = await PDFLib.PDFDocument.load(buffer);
                        }
                        const srcDoc = loadedDocs[docData.id];
                        
                        const pageIndex = pageConfig.pageIndexInDoc - 1; // 0-based
                        const originalPage = srcDoc.getPage(pageIndex);
                        const { width, height } = originalPage.getSize();
                        
                        const cols = [0, ...pageConfig.cols.sort((a,b)=>a-b), 1];
                        const rows = [0, ...pageConfig.rows.sort((a,b)=>a-b), 1];

                        // 计算切片数量
                        const totalSlices = (rows.length - 1) * (cols.length - 1);
                        
                        // 复制页面
                        const copies = await newPdf.copyPages(srcDoc, Array(totalSlices).fill(pageIndex));
                        
                        let copyIdx = 0;
                        // 生成切片
                        for (let r = 0; r < rows.length - 1; r++) {
                            const yStart = rows[r];
                            const yEnd = rows[r+1];
                            const cropH = height * (yEnd - yStart);
                            const cropY = height * (1 - yEnd); // PDF Y axis bottom-up

                            for (let c = 0; c < cols.length - 1; c++) {
                                const xStart = cols[c];
                                const xEnd = cols[c+1];
                                const cropW = width * (xEnd - xStart);
                                const cropX = width * xStart;

                                const pageCopy = copies[copyIdx++];
                                pageCopy.setCropBox(cropX, cropY, cropW, cropH);
                                newPdf.addPage(pageCopy);
                            }
                        }
                    }

                    const pdfBytes = await newPdf.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `super-split-${Date.now()}.pdf`;
                    a.click();
                    URL.revokeObjectURL(url);

                } catch (err) {
                    console.error(err);
                    alert('生成失败: ' + err.message);
                } finally {
                    hideLoading();
                }
            }, 100);
        }

        window.resetAll = () => {
            if(!confirm('确定清空所有文件和设置吗？')) return;
            location.reload();
        };

        function showLoading(t) { els.loadingText.textContent = t; els.loading.classList.remove('hidden'); }
        function hideLoading() { els.loading.classList.add('hidden'); }

    </script>
</body>
</html>
