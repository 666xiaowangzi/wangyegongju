<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF 超级分割工具 (小王子)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .line-col, .line-row { position: absolute; z-index: 50; touch-action: none; will-change: left, top; }
        .line-col { top: 0; bottom: 0; width: 2px; background: #ef4444; cursor: col-resize; }
        .line-row { left: 0; right: 0; height: 2px; background: #3b82f6; cursor: row-resize; }
        .line-col::after { content: ''; position: absolute; left: -15px; right: -15px; top: 0; bottom: 0; }
        .line-row::after { content: ''; position: absolute; top: -15px; bottom: -15px; left: 0; right: 0; }
        .line-col.active { box-shadow: 0 0 12px #ef4444; background: #ef4444; z-index: 60; }
        .line-row.active { box-shadow: 0 0 12px #3b82f6; background: #3b82f6; z-index: 60; }
        .modal-enter { animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .mobile-settings-panel { transition: all 0.3s ease-in-out; overflow: hidden; max-height: 80vh; opacity: 1; }
        .mobile-settings-panel.closed { max-height: 0; opacity: 0; padding: 0; }
        @media (min-width: 768px) { .mobile-settings-panel { display: block !important; max-height: none !important; opacity: 1 !important; } }
        .stepper-btn:active { transform: scale(0.92); background-color: #f1f5f9; }
        .preset-btn { transition: all 0.2s; border: 2px solid transparent; }
        .preset-btn:hover { border-color: #e0e7ff; background-color: #f5f3ff; }
        .preset-btn:active { transform: scale(0.95); }
        .preset-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid #e2e8f0; }
        .preset-card:hover { border-color: #818cf8; background-color: #f5f3ff; transform: translateY(-2px); }
        .preset-card.selected { border-color: #4f46e5; background-color: #eef2ff; ring: 2px solid #4f46e5; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col pb-24 md:pb-10">
    <header class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-[100] border-b border-slate-100">
        <div class="container mx-auto px-4 h-14 md:h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                </div>
                <div class="flex flex-col"><h1 class="text-base md:text-lg font-bold text-slate-800 leading-tight" data-i18n="appTitle">PDF 超级分割工具</h1><span class="text-[10px] text-indigo-500 font-bold tracking-wide uppercase" data-i18n="appSubtitle">小王子</span></div>
            </div>
            <div class="flex items-center gap-2 md:gap-3">
                <button onclick="toggleLanguage()" class="flex items-center gap-1 text-slate-500 border border-slate-200 bg-white px-2 py-1 rounded-lg text-xs font-bold transition active:scale-95"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg><span id="lang-text">EN</span></button>
                <div class="hidden md:flex items-center gap-2">
                    <button onclick="$('add-file-input').click()" class="bg-indigo-50 text-indigo-700 border border-indigo-100 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg><span data-i18n="addFile">添加</span></button>
                    <button onclick="openPreviewConsole()" class="bg-emerald-50 text-emerald-700 border border-emerald-100 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg><span data-i18n="preview">预演</span></button>
                    <button onclick="processAndDownload()" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-md" data-i18n="download">下载</button>
                    <button onclick="resetAll()" class="text-slate-400 p-1.5 hover:text-red-500" title="清空"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 pt-6 flex flex-col items-center">
        <div id="global-toolbar" class="hidden w-full max-w-4xl mb-8 p-4 bg-white/90 backdrop-blur-xl rounded-[1.5rem] shadow-xl shadow-indigo-100/50 border border-white/60 flex flex-col animate-[fadeIn_0.4s] transition-all gap-4">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div class="p-2.5 bg-indigo-50 text-indigo-600 rounded-xl shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243 4.243 3 3 0 004.243-4.243zm0-5.758a3 3 0 10-4.243-4.243 3 3 0 004.243 4.243z"></path></svg></div>
                    <div><span class="text-sm font-bold text-slate-800 block" data-i18n="batchSettings">批量网格</span><span class="text-[10px] text-slate-400 font-medium" data-i18n="batchDesc">一键应用到所有页面</span></div>
                </div>
                <div class="flex gap-2">
                    <button onclick="setPreset(1,2)" class="preset-btn p-2 rounded-lg bg-white border border-slate-200 text-slate-600" title="1列2行"><div class="w-4 h-5 border border-current rounded flex flex-col"><div class="flex-1 border-b border-current"></div><div class="flex-1"></div></div></button>
                    <button onclick="setPreset(2,1)" class="preset-btn p-2 rounded-lg bg-white border border-slate-200 text-slate-600" title="2列1行"><div class="w-5 h-4 border border-current rounded flex"><div class="flex-1 border-r border-current"></div><div class="flex-1"></div></div></button>
                    <button onclick="setPreset(3,1)" class="preset-btn p-2 rounded-lg bg-white border border-slate-200 text-slate-600" title="3列1行"><div class="w-5 h-4 border border-current rounded grid grid-cols-3"><div class="border-r border-current"></div><div class="border-r border-current"></div><div></div></div></button>
                    <button onclick="setPreset(2,2)" class="preset-btn p-2 rounded-lg bg-white border border-slate-200 text-slate-600" title="2列2行"><div class="w-5 h-5 border border-current rounded grid grid-cols-2 grid-rows-2"><div class="border-r border-b border-current"></div><div class="border-b border-current"></div><div class="border-r border-current"></div><div></div></div></button>
                    <button onclick="setPreset(3,3)" class="preset-btn p-2 rounded-lg bg-white border border-slate-200 text-slate-600" title="3列3行"><div class="w-5 h-5 border border-current rounded grid grid-cols-3 grid-rows-3"><div class="border-r border-b border-current"></div><div class="border-r border-b border-current"></div><div class="border-b border-current"></div><div class="border-r border-b border-current"></div><div class="border-r border-b border-current"></div><div class="border-b border-current"></div><div class="border-r border-current"></div><div class="border-r border-current"></div><div></div></div></button>
                </div>
            </div>
            <div class="h-px bg-slate-100 w-full"></div>
            <div class="flex flex-col md:flex-row md:flex-nowrap items-center gap-3 w-full">
                <div class="flex-grow grid grid-cols-2 gap-3 w-full md:w-auto">
                    <div class="bg-white border border-slate-100 rounded-2xl p-1.5 flex items-center justify-between shadow-sm h-[50px] box-border">
                        <div class="flex items-center ml-2 mr-1 gap-1"><span class="w-1.5 h-1.5 rounded-full bg-red-400"></span><span class="text-[10px] font-bold text-slate-500 uppercase" data-i18n="cols">列</span></div>
                        <div class="flex items-center gap-1"><button onclick="stepGlobal('col', -1)" class="stepper-btn w-9 h-9 flex items-center justify-center rounded-xl bg-slate-50 text-slate-600 font-bold hover:bg-slate-100">-</button><input type="number" id="global-col" value="1" min="1" class="w-10 text-center font-bold text-slate-800 outline-none bg-transparent" onchange="applyGlobalDirect()"><button onclick="stepGlobal('col', 1)" class="stepper-btn w-9 h-9 flex items-center justify-center rounded-xl bg-red-50 text-red-500 font-bold hover:bg-red-100">+</button></div>
                    </div>
                    <div class="bg-white border border-slate-100 rounded-2xl p-1.5 flex items-center justify-between shadow-sm h-[50px] box-border">
                        <div class="flex items-center ml-2 mr-1 gap-1"><span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span><span class="text-[10px] font-bold text-slate-500 uppercase" data-i18n="rows">行</span></div>
                        <div class="flex items-center gap-1"><button onclick="stepGlobal('row', -1)" class="stepper-btn w-9 h-9 flex items-center justify-center rounded-xl bg-slate-50 text-slate-600 font-bold hover:bg-slate-100">-</button><input type="number" id="global-row" value="1" min="1" class="w-10 text-center font-bold text-slate-800 outline-none bg-transparent" onchange="applyGlobalDirect()"><button onclick="stepGlobal('row', 1)" class="stepper-btn w-9 h-9 flex items-center justify-center rounded-xl bg-blue-50 text-blue-500 font-bold hover:bg-blue-100">+</button></div>
                    </div>
                </div>
                <button onclick="applyGlobalDirect()" class="w-full md:w-auto md:shrink-0 px-5 bg-slate-800 hover:bg-slate-900 text-white rounded-2xl font-bold text-xs shadow-lg shadow-slate-200 transition-all active:scale-95 flex items-center justify-center gap-2 h-[50px]" data-i18n="applyAll"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span>应用设置</span></button>
            </div>
        </div>

        <div id="upload-area" class="w-full max-w-xl mt-8">
            <div class="group relative border-2 border-dashed border-indigo-200 rounded-3xl bg-white p-10 text-center hover:border-indigo-400 transition-all cursor-pointer shadow-sm" id="drop-zone">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
                <h2 class="text-xl font-bold text-slate-700" data-i18n="clickUpload">点击或拖拽添加 PDF 或图片</h2>
                <p class="text-sm text-slate-400 mt-2" data-i18n="slogan">小王子为你施展分割魔法</p>
                <div class="absolute inset-0 z-10"></div>
            </div>
            <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4 w-full px-2">
                <a id="pdfcraft-link" href="https://pdfcraft.devtoolcafe.com/zh/" target="_blank" class="flex items-center gap-3 p-4 bg-white rounded-2xl shadow-sm border border-slate-100 hover:border-indigo-200 transition-all"><div class="w-12 h-12 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500 shrink-0"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-width="2"></path></svg></div><div class="text-left"><div class="text-sm font-bold text-slate-700">PDFCraft</div><div class="text-xs text-slate-400" data-i18n="pdfcraftDesc">极致轻便的 PDF 在线处理工具箱</div></div></a>
                <a href="https://tools.pdf24.org/zh/" target="_blank" class="flex items-center gap-3 p-4 bg-white rounded-2xl shadow-sm border border-slate-100 hover:border-blue-200 transition-all"><div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 shrink-0"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-width="2"></path></svg></div><div class="text-left"><div class="text-sm font-bold text-slate-700">PDF24 Tools</div><div class="text-xs text-slate-400" data-i18n="pdf24Desc">免费且功能强大的离线级工具</div></div></a>
            </div>
        </div>
        <div id="pages-container" class="w-full max-w-5xl flex flex-col gap-5 hidden pb-20"></div>
    </main>

    <div id="bottom-bar" class="hidden fixed bottom-6 left-4 right-4 z-[90] flex justify-end items-center gap-2 md:hidden">
        <div class="bg-white/90 backdrop-blur-md border border-slate-200 rounded-2xl shadow-2xl p-2 flex gap-2">
            <button onclick="resetAll()" class="w-8 h-8 text-red-400 bg-red-50 rounded-lg flex items-center justify-center"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2"></path></svg></button>
            <div class="w-px bg-slate-200 h-8 mx-1"></div>
            <button onclick="document.getElementById('add-file-input').click()" class="px-2 text-slate-500 flex flex-col items-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2"></path></svg><span class="text-[9px] font-bold" data-i18n="addFile">添加</span></button>
            <button onclick="openPreviewConsole()" class="px-2 text-emerald-600 flex flex-col items-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-width="2"></path><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-width="2"></path></svg><span class="text-[9px] font-bold" data-i18n="preview">预演</span></button>
            <button onclick="processAndDownload()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold" data-i18n="download">下载</button>
        </div>
    </div>

    <div id="preview-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/90 p-4">
        <div class="bg-white w-full max-w-6xl h-[90vh] rounded-2xl shadow-2xl flex flex-col md:flex-row overflow-hidden modal-enter relative">
            <div class="w-full md:w-80 bg-slate-50 border-r border-slate-200 flex flex-col shrink-0">
                <div class="p-4 border-b bg-white flex justify-between items-center cursor-pointer md:cursor-default" onclick="toggleMobileSettings()">
                    <div><h3 class="font-bold text-lg text-slate-800" data-i18n="previewConsole">高级输出控制台</h3><p class="text-xs text-slate-400 hidden md:block" data-i18n="consoleDesc">调整参数后点击刷新</p></div>
                    <div class="flex items-center gap-2 md:hidden">
                        <div class="flex items-center gap-2 text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg"><span class="text-xs font-bold" data-i18n="settingsToggle">设置</span><svg id="mobile-toggle-icon" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2"></path></svg></div>
                        <button onclick="event.stopPropagation(); closePreview()" class="p-1.5 bg-slate-100 rounded-full text-slate-500 hover:bg-red-50 hover:text-red-500 transition ml-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                    </div>
                </div>
                <div id="settings-container" class="mobile-settings-panel flex-grow p-4 space-y-3 closed">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="w-full px-4 py-3 flex items-center gap-2 border-b border-slate-100 bg-slate-50/50"><svg class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" stroke-width="2"></path></svg><span class="text-sm font-bold text-slate-700" data-i18n="sliceOrder">切片排序</span></div>
                        <div class="p-4"><select id="preview-order-select" class="w-full border rounded-lg px-3 py-2 text-sm font-bold"><option value="row" data-i18n="orderRow">行优先 (Z字形)</option><option value="col" data-i18n="orderCol">列优先 (N字形)</option></select></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="w-full px-4 py-3 flex items-center gap-2 border-b border-slate-100 bg-slate-50/50"><svg class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="2"></path></svg><span class="text-sm font-bold text-slate-700" data-i18n="sliceRotation">切片后旋转</span></div>
                        <div class="p-4 flex gap-2">
                            <button onclick="setPreviewRotation(0)" class="rot-btn flex-1 py-1.5 rounded-lg border text-xs font-bold bg-indigo-600 text-white" data-val="0">0°</button>
                            <button onclick="setPreviewRotation(90)" class="rot-btn flex-1 py-1.5 rounded-lg border text-xs font-bold" data-val="90">90°</button>
                            <button onclick="setPreviewRotation(180)" class="rot-btn flex-1 py-1.5 rounded-lg border text-xs font-bold" data-val="180">180°</button>
                            <button onclick="setPreviewRotation(270)" class="rot-btn flex-1 py-1.5 rounded-lg border text-xs font-bold" data-val="270">270°</button>
                        </div>
                    </div>
                    <button onclick="refreshPreview()" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold flex items-center justify-center gap-2"><svg class="w-4 h-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="2"></path></svg><span data-i18n="refreshPreview">刷新预览 / 生效</span></button>
                </div>
                <div class="hidden p-4 border-t bg-white md:hidden"></div>
            </div>
            <div class="flex-grow flex flex-col bg-slate-100 overflow-hidden relative">
                <div class="absolute top-4 right-4 z-10 hidden md:block"><button onclick="closePreview()" class="bg-white/90 backdrop-blur p-2 rounded-full shadow hover:bg-red-50 text-slate-500 hover:text-red-500 transition">✕</button></div>
                <div id="preview-content" class="flex-grow overflow-y-auto p-4 md:p-8 flex flex-col items-center gap-6"></div>
                <div class="p-4 bg-white border-t flex justify-between items-center shrink-0 z-20">
                    <button id="preview-more-btn" onclick="loadPreviewBatch()" class="hidden w-full md:w-auto px-6 py-2.5 bg-white border border-slate-200 text-indigo-600 text-sm font-bold flex items-center justify-center gap-2 hover:bg-slate-50 rounded-xl transition-all shadow-sm"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 13l-7 7-7-7" stroke-width="2"></path></svg><span data-i18n="loadMore">加载更多</span></button>
                    <div class="flex gap-2 ml-auto"><button onclick="processAndDownload()" class="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl font-bold flex items-center gap-2 shadow-lg shadow-indigo-200"><span data-i18n="downloadPDF">下载 PDF</span></button></div>
                </div>
            </div>
        </div>
    </div>

    <div id="copy-modal" class="hidden fixed inset-0 z-[150] flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 modal-enter">
            <div class="flex justify-between items-center mb-6"><h3 class="text-lg font-bold" data-i18n="applySettings">应用分割参数</h3><button onclick="closeCopyModal()" class="p-2 bg-slate-100 rounded-full">✕</button></div>
            <div class="space-y-3 mb-8">
                <label class="flex items-center gap-4 p-4 border rounded-xl cursor-pointer"><input type="radio" name="copy-target" value="all" class="w-5 h-5"><span data-i18n="allPages">所有页面</span></label>
                <label class="flex items-center gap-4 p-4 border rounded-xl cursor-pointer"><input type="radio" name="copy-target" value="current-file" class="w-5 h-5"><span data-i18n="currentFile">仅当前文件</span></label>
                <label class="flex flex-col p-4 border rounded-xl cursor-pointer"><div class="flex items-center gap-4 mb-3"><input type="radio" name="copy-target" value="range" class="w-5 h-5" checked><span data-i18n="pageRange">指定页码范围</span></div><input type="text" id="range-input" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="1-5, 8"></label>
            </div>
            <button onclick="executeCopy()" class="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold" data-i18n="confirmApply">确认应用</button>
        </div>
    </div>

    <div id="loading" class="hidden fixed inset-0 z-[300] flex items-center justify-center loading-overlay">
        <div class="bg-white/95 px-8 py-8 rounded-3xl shadow-2xl flex flex-col items-center w-80 border border-slate-100">
            <div class="relative w-16 h-16 mb-6"><div class="absolute inset-0 border-4 border-indigo-100 rounded-full"></div><div class="absolute inset-0 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>
            <p id="loading-text" class="text-slate-800 font-bold text-lg mb-4 text-center" data-i18n="loadingMagic">正在施展分割魔法...</p>
            <div class="w-full bg-slate-100 rounded-full h-2 mb-2 overflow-hidden"><div id="loading-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300 w-0"></div></div>
            <p id="loading-percent" class="text-xs text-slate-400 font-mono mb-6">0%</p>
            <button onclick="cancelProcess()" class="px-6 py-2 rounded-xl text-xs font-bold text-red-500 bg-red-50 hover:bg-red-100 transition-colors"><span data-i18n="cancel">停止操作</span></button>
        </div>
    </div>

    <div id="drag-overlay" class="hidden fixed inset-0 z-[100] bg-indigo-900/80 backdrop-blur-sm flex flex-col items-center justify-center transition-all duration-200">
        <div class="border-4 border-dashed border-white/50 rounded-[3rem] p-12 flex flex-col items-center animate-bounce-slow">
            <svg class="w-24 h-24 text-white mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <h2 id="drag-overlay-text" class="text-3xl font-bold text-white">释放以添加文件</h2>
        </div>
    </div>

    <input type="file" id="add-file-input" accept="application/pdf,image/*" multiple class="hidden" />

    <script>
        var state = { documents: [], pages: [], nextDocId: 1, drag: { active: false }, outputSettings: { rotation: 0, sortOrder: 'row' }, previewPdfDoc: null, previewPageNum: 1, copySourceIndex: -1, processing: { cancelled: false }, renderTasks: {}, previewCursor: 0, previewLoading: false };
        function $(id) { return document.getElementById(id); }
        function $$(n) { return Array.from({length: n-1}, (_, i) => (i+1)/n); }
        var els = { fileInput: $('add-file-input'), uploadArea: $('upload-area'), dropZone: $('drop-zone'), pagesContainer: $('pages-container'), loading: $('loading'), loadingText: $('loading-text'), loadingBar: $('loading-bar'), loadingPercent: $('loading-percent'), modal: $('copy-modal'), previewModal: $('preview-modal'), previewContent: $('preview-content'), previewMoreBtn: $('preview-more-btn'), globalToolbar: $('global-toolbar'), bottomBar: $('bottom-bar') };
        var currentLang = 'zh';
        var i18n = {
            zh: { appTitle: "PDF 超级分割工具", appSubtitle: "小王子", addFile: "添加", download: "下载", preview: "预演", batchSettings: "批量分割", batchDesc: "一键应用设置", cols: "列数", rows: "行数", applyAll: "应用设置", clickUpload: "点击或拖拽添加 PDF 或图片", slogan: "小王子为你施展分割魔法", pdfcraftDesc: "极致轻便的 PDF 在线处理工具箱", pdf24Desc: "免费且功能强大的离线级工具", applySettings: "应用分割参数", allPages: "所有页面", currentFile: "仅当前文件", pageRange: "页码范围", confirmApply: "确认应用", loadingMagic: "正在施展魔法...", parsing: "正在解析...", copy: "复制", loading: "加载中...", alertParseError: "失败: ", alertClear: "确定清空吗？", previewConsole: "高级输出控制台", consoleDesc: "调整后刷新", close: "继续编辑", loadMore: "加载更多", sliceRotation: "切片旋转", sliceOrder: "切片排序", orderRow: "行优先 (Z字)", orderCol: "列优先 (N字)", refreshPreview: "刷新预览", previewing: "正在生成预览...", downloadPDF: "下载 PDF", settingsToggle: "设置", cancel: "停止操作", cancelled: "操作已取消" },
            en: { appTitle: "PDF Grid Cutter", appSubtitle: "Little Prince", addFile: "Add", download: "DL", preview: "Preview", batchSettings: "Batch", batchDesc: "Apply to all pages", cols: "Cols", rows: "Rows", applyAll: "Apply All", clickUpload: "Click/Drag PDF or Images", slogan: "Little Prince casts splitting magic", pdfcraftDesc: "Lightweight PDF online toolbox", pdf24Desc: "Powerful Offline Tools", applySettings: "Apply Settings", allPages: "All Pages", currentFile: "Current File", pageRange: "Range", confirmApply: "Apply", loadingMagic: "Casting magic...", parsing: "Parsing...", copy: "Copy", loading: "Loading...", alertParseError: "Error: ", alertClear: "Clear all?", previewConsole: "Console", consoleDesc: "Refresh to apply", close: "Edit", loadMore: "Load More", sliceRotation: "Rotation", sliceOrder: "Order", orderRow: "Row Major", orderCol: "Col Major", refreshPreview: "Refresh", previewing: "Generating Preview...", downloadPDF: "Download PDF", settingsToggle: "Settings", cancel: "Cancel", cancelled: "Operation Cancelled" }
        };
        function t(k) { return i18n[currentLang][k] || k; }
        window.toggleLanguage = () => { currentLang = currentLang === 'zh' ? 'en' : 'zh'; updateUI(); };
        function updateUI() { document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = t(el.dataset.i18n)); $('lang-text').innerText = currentLang === 'zh' ? 'EN' : '中'; if($('pdfcraft-link')) $('pdfcraft-link').href = `https://pdfcraft.devtoolcafe.com/${currentLang === 'zh' ? 'zh/' : ''}`; }
        function formatFileSize(bytes) { if (bytes === 0) return '0 B'; const k = 1024; const sizes = ['B', 'KB', 'MB', 'GB']; const i = Math.floor(Math.log(bytes) / Math.log(k)); return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i]; }
        
        let dragCounter = 0;
        window.addEventListener('dragenter', (e) => { e.preventDefault(); dragCounter++; $('drag-overlay').classList.remove('hidden'); $('drag-overlay-text').innerText = state.documents.length > 0 ? "释放以追加文件" : "释放以添加文件"; });
        window.addEventListener('dragleave', (e) => { e.preventDefault(); dragCounter--; if (dragCounter === 0) $('drag-overlay').classList.add('hidden'); });
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => { e.preventDefault(); dragCounter = 0; $('drag-overlay').classList.add('hidden'); if (e.dataTransfer.files && e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files); });

        els.dropZone.onclick = () => els.fileInput.click();
        els.fileInput.onchange = e => handleFiles(e.target.files);
        els.dropZone.ondrop = e => { e.preventDefault(); e.stopPropagation(); els.dropZone.classList.remove('border-indigo-500'); handleFiles(e.dataTransfer.files); };
        ['dragover', 'dragenter'].forEach(v => els.dropZone['on'+v] = e => { e.preventDefault(); els.dropZone.classList.add('border-indigo-500'); });

        async function handleFiles(files) {
            if (!files.length) return;
            showLoading(t('parsing'), 0);
            const slowMsgTimer = setTimeout(() => { if(!els.loading.classList.contains('hidden')) els.loadingText.textContent = "检测到大文件，解析时间较长，请耐心等待..."; }, 60000);
            try {
                [els.uploadArea, els.pagesContainer, els.globalToolbar, els.bottomBar].forEach(el => el.classList.toggle('hidden', el === els.uploadArea && state.documents.length === 0));
                if(state.documents.length > 0) { els.uploadArea.classList.add('hidden'); els.pagesContainer.classList.remove('hidden'); els.globalToolbar.classList.remove('hidden'); if (window.innerWidth < 768) els.bottomBar.classList.remove('hidden'); }
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileProgress = (i / files.length) * 100;
                    showLoading(t('parsing') + ` ${i+1}/${files.length}`, fileProgress);
                    await new Promise(r => setTimeout(r, 10));

                    let doc = null, storage = file;
                    if (file.type === 'application/pdf') doc = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                    else if (file.type.startsWith('image/')) {
                        const bytes = await imageToPdfBytes(file);
                        storage = new Blob([bytes], {type:'application/pdf'}); storage.name = file.name;
                        doc = await pdfjsLib.getDocument(bytes).promise;
                    } else continue;
                    const docId = state.nextDocId++;
                    const formattedSize = formatFileSize(storage.size);
                    state.documents.push({ id: docId, file: storage, pdfDoc: doc, fileName: file.name, fileSize: formattedSize });
                    for (let j = 1; j <= doc.numPages; j++) {
                        state.pages.push({ docId, pageIndexInDoc: j, cols: [], rows: [], rendered: false });
                        createPageCard(state.pages.length - 1);
                        if (j % 20 === 0) {
                            const subProgress = fileProgress + (j / doc.numPages) * (100 / files.length);
                            showLoading(t('parsing') + ` ${i+1}/${files.length}`, subProgress);
                            await new Promise(r => setTimeout(r, 0));
                        }
                    }
                }
                showLoading(t('parsing'), 100);
            } catch (e) { alert(t('alertParseError') + e.message); if(state.documents.length === 0) [els.uploadArea, els.pagesContainer, els.globalToolbar, els.bottomBar].forEach(el => el.classList.toggle('hidden', el !== els.uploadArea)); } finally { clearTimeout(slowMsgTimer); hideLoading(); els.fileInput.value = ''; }
        }

        async function imageToPdfBytes(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const pdf = await PDFLib.PDFDocument.create();
                        const img = new Image(); img.src = reader.result; await img.decode();
                        const canvas = document.createElement('canvas'); canvas.width = img.width; canvas.height = img.height; canvas.getContext('2d').drawImage(img, 0, 0);
                        const pngImageBytes = await fetch(canvas.toDataURL('image/png')).then(res => res.arrayBuffer());
                        const embeddedImg = await pdf.embedPng(pngImageBytes);
                        const page = pdf.addPage([img.width, img.height]);
                        page.drawImage(embeddedImg, { x: 0, y: 0, width: img.width, height: img.height });
                        resolve(await pdf.save());
                    } catch (e) { reject(e); }
                };
                reader.onerror = reject; reader.readAsDataURL(file);
            });
        }

        function getSlices(p, width, height) {
            const cs = [0, ...p.cols.sort((a,b)=>a-b), 1], rs = [0, ...p.rows.sort((a,b)=>a-b), 1], slices = [];
            for(let r=0; r<rs.length-1; r++) for(let c=0; c<cs.length-1; c++) slices.push({x:cs[c]*width, y:height-rs[r+1]*height, w:(cs[c+1]-cs[c])*width, h:(rs[r+1]-rs[r])*height, cx:-cs[c]*width, cy:-(1-rs[r+1])*height});
            return {slices, cs, rs};
        }

        var observer = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { renderPageCanvas(parseInt(e.target.dataset.index)); observer.unobserve(e.target); } }), { rootMargin: '300px' });

        function createPageCard(idx) {
            const p = state.pages[idx], d = state.documents.find(doc => doc.id === p.docId), card = document.createElement('div');
            card.className = "bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden";
            card.innerHTML = `<div class="bg-slate-50/80 border-b p-3 flex justify-between items-center"><div class="flex flex-col md:flex-row md:items-center gap-1 md:gap-3 truncate"><div class="flex items-center gap-2"><span class="w-6 h-6 bg-white rounded-full flex items-center justify-center text-xs font-bold">${idx+1}</span><span class="text-xs text-slate-500 font-bold truncate max-w-[120px]">${d.fileName}</span></div><span class="text-[10px] text-slate-400 font-mono bg-slate-100 px-1.5 py-0.5 rounded hidden md:inline-block">${d.fileSize}</span></div><div class="flex items-center gap-2"><div class="flex items-center bg-white rounded border p-0.5"><input type="number" id="in-col-${idx}" value="1" min="1" class="w-5 text-center text-xs" onchange="updatePageSplit(${idx})"><span class="text-slate-300 text-[10px]">x</span><input type="number" id="in-row-${idx}" value="1" min="1" class="w-5 text-center text-xs" onchange="updatePageSplit(${idx})"></div><button onclick="openCopyModal(${idx})" class="p-1.5 text-indigo-500 text-xs font-bold" data-i18n="copy">${t('copy')}</button></div></div><div class="bg-slate-100 flex justify-center relative min-h-[200px]"><div class="relative shadow-lg bg-white my-4 lazy-canvas select-none" data-index="${idx}"><canvas id="canvas-${idx}" class="block max-w-full pointer-events-none"></canvas><div id="overlay-${idx}" class="absolute inset-0 z-10"></div><div id="ph-${idx}" class="absolute inset-0 flex items-center justify-center text-xs text-slate-400">${t('loading')}</div></div></div>`;
            els.pagesContainer.appendChild(card); observer.observe(card.querySelector('.lazy-canvas'));
        }

        async function renderPageCanvas(idx) {
            if (state.renderTasks[idx]) { state.renderTasks[idx].cancel(); delete state.renderTasks[idx]; }
            try {
                const p = state.pages[idx]; if (!p) return;
                const doc = state.documents.find(d => d.id === p.docId); if (!doc) return;
                const page = await doc.pdfDoc.getPage(p.pageIndexInDoc);
                if (state.renderTasks[idx]) state.renderTasks[idx].cancel();
                const cvs = $(`canvas-${idx}`); if (!cvs) return;
                const viewportRaw = page.getViewport({ scale: 1 });
                const isHighRes = (viewportRaw.width * viewportRaw.height) > 3000000;
                const visualWidth = Math.min(window.innerWidth - 32, 800);
                const svp = page.getViewport({ scale: (visualWidth / viewportRaw.width) * (isHighRes ? 0.6 : 1.2) }); 
                cvs.width = svp.width; cvs.height = svp.height; cvs.style.width = "100%"; cvs.style.height = "auto"; cvs.parentElement.style.width = `${visualWidth}px`; cvs.parentElement.style.maxWidth = '100%';
                const renderTask = page.render({ canvasContext: cvs.getContext('2d'), viewport: svp });
                state.renderTasks[idx] = renderTask; await renderTask.promise; delete state.renderTasks[idx];
                $(`ph-${idx}`).remove(); p.rendered = true; renderLines(idx);
            } catch(e) { if (e.name !== 'RenderingCancelledException') console.error("Render failed", e); }
        }

        function renderLines(idx) {
            const ol = $(`overlay-${idx}`), p = state.pages[idx];
            ol.innerHTML = '';
            const add = (pct, t, i) => {
                const l = document.createElement('div'); l.className = t === 'col' ? 'line-col' : 'line-row'; l.style[t === 'col' ? 'left' : 'top'] = (pct * 100) + '%';
                const start = e => { if(e.touches) e.preventDefault(); startDrag(e.touches?e.touches[0]:e, t, idx, i, l); };
                l.onmousedown = l.ontouchstart = start; ol.appendChild(l);
            };
            p.cols.forEach((v, i) => add(v, 'col', i)); p.rows.forEach((v, i) => add(v, 'row', i));
        }

        function startDrag(e, type, gIdx, lIdx, el) { state.drag = { active: true, type, gIdx, lIdx, el }; el.classList.add('active'); }
        window.onmousemove = window.ontouchmove = e => {
            const d = state.drag; if (!d.active) return;
            const r = $(`overlay-${d.gIdx}`).getBoundingClientRect(), m = e.touches ? e.touches[0] : e;
            const pct = Math.max(0, Math.min(1, d.type === 'col' ? (m.clientX - r.left)/r.width : (m.clientY - r.top)/r.height));
            state.pages[d.gIdx][d.type === 'col' ? 'cols' : 'rows'][d.lIdx] = pct; d.el.style[d.type === 'col' ? 'left' : 'top'] = (pct * 100) + '%';
        };
        window.onmouseup = window.ontouchend = () => { if(state.drag.active) state.drag.el.classList.remove('active'); state.drag.active = false; };

        window.updatePageSplit = idx => {
            const [c, r] = ['col', 'row'].map(k => parseInt($(`in-${k}-${idx}`).value) || 1);
            state.pages[idx].cols = $$(c); state.pages[idx].rows = $$(r); renderLines(idx);
        };
        window.stepGlobal = (type, delta) => { const el = $(`global-${type}`); let val = parseInt(el.value) || 1; val = Math.max(1, val + delta); el.value = val; };
        window.setPreset = (c, r) => { $(`global-col`).value = c; $(`global-row`).value = r; applyGlobalDirect(); }
        window.setPreviewPreset = (c, r) => { $(`global-col`).value = c; $(`global-row`).value = r; applyGlobalDirect(); refreshPreview(); }
        window.applyGlobalDirect = () => {
            const [c, r] = ['col', 'row'].map(k => parseInt($(`global-${k}`).value) || 1);
            state.pages.forEach((p, i) => { p.cols = $$(c); p.rows = $$(r); $(`in-col-${i}`).value = c; $(`in-row-${i}`).value = r; if(p.rendered) renderLines(i); });
        };

        window.openCopyModal = i => { state.copySourceIndex = i; els.modal.classList.remove('hidden'); };
        window.closeCopyModal = () => els.modal.classList.add('hidden');
        window.executeCopy = () => {
            const src = state.pages[state.copySourceIndex], type = document.querySelector('input[name="copy-target"]:checked').value;
            let tgts = type === 'all' ? state.pages.map((_,i)=>i) : type === 'current-file' ? state.pages.map((p,i)=>p.docId===src.docId?i:-1).filter(i=>i!==-1) : [];
            if(!tgts.length && type === 'range') $('range-input').value.split(/[,，]/).forEach(v => { const [s,e] = v.split('-').map(Number); if(e) for(let i=s;i<=e;i++) tgts.push(i-1); else if(s) tgts.push(s-1); });
            tgts.forEach(i => { if(state.pages[i]) { state.pages[i].cols = [...src.cols]; state.pages[i].rows = [...src.rows]; $(`in-col-${i}`).value = src.cols.length+1; $(`in-row-${i}`).value = src.rows.length+1; if(state.pages[i].rendered) renderLines(i); } });
            closeCopyModal();
        };

        window.toggleMobileSettings = () => { $('settings-container').classList.toggle('closed'); $('mobile-toggle-icon').classList.toggle('rotate-180'); };
        window.setPreviewRotation = deg => { state.outputSettings.rotation = deg; document.querySelectorAll('.rot-btn').forEach(b => { b.classList.toggle('bg-indigo-600', +b.dataset.val===deg); b.classList.toggle('text-white', +b.dataset.val===deg); }); };
        window.openPreviewConsole = () => { if(state.pages.length) { els.previewModal.classList.remove('hidden'); refreshPreview(); } };
        window.refreshPreview = () => { state.outputSettings.sortOrder = $('preview-order-select').value; state.previewPageNum = 1; state.previewCursor = 0; els.previewContent.innerHTML = ''; loadPreviewBatch(); };

        window.loadPreviewBatch = async () => {
            if (state.previewLoading || state.previewCursor >= state.pages.length) return;
            state.previewLoading = true; const btn = els.previewMoreBtn; btn.innerHTML = `<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> ${t('loading')}`; btn.classList.remove('hidden');
            try {
                const batchSize = 2, endCursor = Math.min(state.previewCursor + batchSize, state.pages.length), batchPdfDoc = await PDFLib.PDFDocument.create(), cache = {};
                for (let i = state.previewCursor; i < endCursor; i++) {
                    const p = state.pages[i], d = state.documents.find(doc => doc.id === p.docId);
                    if (!cache[p.docId]) cache[p.docId] = await PDFLib.PDFDocument.load(await d.file.arrayBuffer());
                    const { width, height } = cache[p.docId].getPages()[p.pageIndexInDoc - 1].getSize(), { slices, cs, rs } = getSlices(p, width, height);
                    const pSlices = [];
                    for(const sl of slices) {
                        const sDoc = await PDFLib.PDFDocument.create(), [cp] = await sDoc.copyPages(cache[p.docId], [p.pageIndexInDoc-1]);
                        cp.setCropBox(sl.x, sl.y, sl.w, sl.h); sDoc.addPage(cp); pSlices.push(await PDFLib.PDFDocument.load(await sDoc.save()));
                    }
                    const sortedSlices = state.outputSettings.sortOrder === 'col' ? Array.from({length: cs.length-1}, (_,c)=>Array.from({length: rs.length-1}, (_,r)=>pSlices[r*(cs.length-1)+c])).flat() : pSlices;
                    for (const s of sortedSlices) { const [p] = await batchPdfDoc.copyPages(s, [0]); p.setRotation(PDFLib.degrees(state.outputSettings.rotation)); batchPdfDoc.addPage(p); }
                }
                const proxy = await pdfjsLib.getDocument(await batchPdfDoc.save()).promise;
                for (let i = 1; i <= proxy.numPages; i++) {
                    const page = await proxy.getPage(i), vp = page.getViewport({ scale: 1 }), cvs = document.createElement('canvas');
                    const scale = (els.previewContent.clientWidth * 0.9 / vp.width) * (vp.width*vp.height>3000000?0.5:1), svp = page.getViewport({ scale });
                    cvs.className = "bg-white shadow-lg shrink-0 fade-in"; cvs.width = svp.width; cvs.height = svp.height; cvs.style.maxWidth = "90%";
                    await page.render({ canvasContext: cvs.getContext('2d'), viewport: svp }).promise; els.previewContent.appendChild(cvs);
                }
                state.previewCursor = endCursor;
            } catch(e) { console.error(e); alert("Preview Error: " + e.message); } finally {
                state.previewLoading = false;
                if (state.previewCursor >= state.pages.length) btn.classList.add('hidden'); else { btn.innerHTML = `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 13l-7 7-7-7" stroke-width="2"></path></svg> <span>${t('loadMore')}</span>`; btn.classList.remove('hidden'); }
            }
        };

        async function generateFinalPDF(isPreview = false) {
            state.processing.cancelled = false; const out = await PDFLib.PDFDocument.create(), cache = {}, slices = [], total = state.pages.length;
            for (let i = 0; i < total; i++) {
                if (state.processing.cancelled) throw new Error(t('cancelled'));
                const p = state.pages[i];
                if (!isPreview) { const pct = Math.round((i / total) * 100); showLoading(t('loadingMagic'), pct); if (i % 2 === 0) await new Promise(r => setTimeout(r, 0)); }
                const d = state.documents.find(doc => doc.id === p.docId);
                if (!cache[p.docId]) cache[p.docId] = await PDFLib.PDFDocument.load(await d.file.arrayBuffer());
                const { width, height } = cache[p.docId].getPages()[p.pageIndexInDoc - 1].getSize(), { slices: pageSlices, cs, rs } = getSlices(p, width, height);
                const pSlices = [];
                for(const sl of pageSlices) {
                    const sDoc = await PDFLib.PDFDocument.create(), [cp] = await sDoc.copyPages(cache[p.docId], [p.pageIndexInDoc-1]);
                    cp.setCropBox(sl.x, sl.y, sl.w, sl.h); sDoc.addPage(cp); pSlices.push(await PDFLib.PDFDocument.load(await sDoc.save()));
                }
                slices.push(...(state.outputSettings.sortOrder === 'col' ? Array.from({length: cs.length-1}, (_,c)=>Array.from({length: rs.length-1}, (_,r)=>pSlices[r*(cs.length-1)+c])).flat() : pSlices));
            }
            if (state.processing.cancelled) throw new Error(t('cancelled'));
            for (const s of slices) { const [p] = await out.copyPages(s, [0]); p.setRotation(PDFLib.degrees(state.outputSettings.rotation)); out.addPage(p); }
            return out;
        }
        
        window.cancelProcess = () => { state.processing.cancelled = true; hideLoading(); };
        window.renderMorePreview = () => {}; 
        window.closePreview = () => els.previewModal.classList.add('hidden');
        window.processAndDownload = () => { showLoading(t('loadingMagic'), 0); setTimeout(async () => { try { const blob = new Blob([await (await generateFinalPDF()).save()], {type:'application/pdf'}), url = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = url; l.download = `LittlePrince_Cut_${Date.now()}.pdf`; l.click(); setTimeout(() => URL.revokeObjectURL(url), 100); } catch(e) { if(e.message !== t('cancelled')) alert(e.message); } finally { hideLoading(); } }, 50); };
        window.resetAll = () => { if(confirm(t('alertClear'))) { location.reload(); }};
        function showLoading(txt, pct) { els.loadingText.textContent = txt; if (typeof pct === 'number') { els.loadingBar.style.width = `${pct}%`; els.loadingPercent.textContent = `${pct}%`; } els.loading.classList.remove('hidden'); }
        function hideLoading() { els.loading.classList.add('hidden'); }
        updateUI();
    </script>
</body>
</html>
